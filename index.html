<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#faf8f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="飛宮易卦">
  <title>飛宮易卦</title>
  <link rel="icon" href="icon.png" type="image/png" sizes="1024x1024">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="切換卦例頁面">
      <span></span><span></span><span></span>
    </button>
    <h1 id="appTitle">飛宮易卦</h1>
    <div class="header-spacer" aria-hidden="true"></div>
  </header>

  <div id="viewCast">
  <div class="info-panel" id="infoPanel">
    <div class="info-summary" id="infoSummary">
      <div class="info-summary-text" id="infoSummaryText">載入中…</div>
      <div class="info-summary-arrow">▼</div>
    </div>
    <div class="info-body">
      <div class="info-row">
        <label>日期</label>
        <div class="datetime-field">
          <input type="text" id="dateDisplay" class="datetime-display" readonly tabindex="-1" aria-hidden="true">
          <input type="date" id="dateInput" class="datetime-native" aria-label="日期">
        </div>
      </div>
      <div class="info-row">
        <label>時間</label>
        <div class="datetime-field">
          <input type="text" id="timeDisplay" class="datetime-display" readonly tabindex="-1" aria-hidden="true">
          <input type="time" id="timeInput" class="datetime-native" aria-label="時間">
        </div>
      </div>
      <div class="info-row">
        <label>城市</label>
        <input type="text" id="cityInput" value="香港" placeholder="輸入城市名">
      </div>
      <div class="info-readout" id="infoReadout"></div>
      <div class="info-dun" id="infoDun"></div>
      <div class="nominatim-attr">地理位置數據 © OpenStreetMap contributors</div>
    </div>
  </div>

  <div class="question-row">
    <input type="text" id="questionInput" placeholder="今次問甚麼">
  </div>

  <div class="top-section">
    <div class="input-area" id="inputArea"></div>

    <div class="hex-result">
      <div class="hex-box">
        <div class="hex-box-title">本卦</div>
        <div class="hex-box-lines" id="benLines"></div>
        <div class="hex-box-name" id="benName">—</div>
      </div>
      <div class="hex-box">
        <div class="hex-box-title">變卦</div>
        <div class="hex-box-lines" id="chgLines"></div>
        <div class="hex-box-name" id="chgName">—</div>
      </div>
    </div>
  </div>

  <button class="btn" id="castBtn">起 卦</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="chain-section" id="sixiangSection">
    <div class="chain-title">四 象 八 情</div>
    <div class="chain-item">
      <div class="sixiang-text" id="sixiangText"></div>
    </div>
  </div>

  <div class="nine-grid-section" id="nineGridSection">
    <div class="bagua-wrap" id="baguaWrap"></div>
  </div>

  <div class="chain-section" id="chainSection">
    <div class="chain-title">正 推</div>
    <div id="chainList"></div>
  </div>

  <div class="chain-section" id="pangtongSection">
    <div class="chain-title">旁 通</div>
    <div id="pangtongList"></div>
  </div>

  <div class="chain-section" id="chuleiSection">
    <div class="chain-title">觸 類</div>
    <div id="chuleiList"></div>
  </div>

  <div class="chain-section" id="qimenSection" style="display:none;">
    <div class="chain-title" id="qimenTitle">奇 門 局</div>
    <div class="qimen-wrap" id="qimenWrap"></div>
  </div>

  <div class="footer-actions" id="footerActions">
    <div class="footer-btn-row">
      <button class="btn-footer" id="screenshotBtn" type="button">📷 生 成 長 圖</button>
      <button class="btn-footer" id="saveHistoryBtn" type="button">📝 存 入 紀 錄</button>
    </div>
    <div class="save-history-msg" id="saveHistoryMsg"></div>
  </div>
  </div>

  <div id="viewCases" class="view-cases" hidden>
    <div class="case-search-wrap">
      <div class="question-row case-search-row">
        <input type="text" id="caseSearchInput" placeholder="搜尋問事關鍵詞" autocomplete="off">
      </div>
      <div class="case-suggest" id="caseSuggest" hidden></div>
    </div>
    <div class="case-search-status" id="caseSearchStatus"></div>

    <div id="caseDetail" class="case-detail" hidden>
      <button type="button" class="case-back-btn" id="caseBackBtn">← 重新搜尋</button>
      <div id="caseCaptureRoot" class="case-capture-root">
        <div class="case-meta" id="caseMeta"></div>

        <div class="top-section case-hex-section">
          <div class="hex-result case-hex-result">
            <div class="hex-box">
              <div class="hex-box-title">本卦</div>
              <div class="hex-box-lines" id="caseBenLines"></div>
              <div class="hex-box-name" id="caseBenName">—</div>
            </div>
            <div class="hex-box">
              <div class="hex-box-title">變卦</div>
              <div class="hex-box-lines" id="caseChgLines"></div>
              <div class="hex-box-name" id="caseChgName">—</div>
            </div>
          </div>
        </div>

        <div class="chain-section" id="caseSixiangSection" style="display:none;">
          <div class="chain-title">四 象 八 情</div>
          <div class="chain-item">
            <div class="sixiang-text" id="caseSixiangText"></div>
          </div>
        </div>

        <div class="nine-grid-section" id="caseNineGridSection" style="display:block;">
          <div class="bagua-wrap" id="caseBaguaWrap"></div>
        </div>

        <div class="chain-section" id="caseChainSection" style="display:none;">
          <div class="chain-title">正 推</div>
          <div id="caseChainList"></div>
        </div>

        <div class="chain-section" id="casePangtongSection" style="display:none;">
          <div class="chain-title">旁 通</div>
          <div id="casePangtongList"></div>
        </div>

        <div class="chain-section" id="caseChuleiSection" style="display:none;">
          <div class="chain-title">觸 類</div>
          <div id="caseChuleiList"></div>
        </div>

        <div class="chain-section" id="caseQimenSection" style="display:none;">
          <div class="chain-title" id="caseQimenTitle">奇 門 局</div>
          <div class="qimen-wrap" id="caseQimenWrap"></div>
        </div>
      </div>

      <div class="footer-actions case-footer-actions" id="caseFooterActions">
        <div class="footer-btn-row case-footer-btn-stack">
          <button class="btn-footer" id="caseScreenshotBtn" type="button">📷 生 成 長 圖</button>
          <button class="btn-footer" id="caseNoteBtn" type="button">✏️ 加 入 筆 記</button>
        </div>
        <div class="save-history-msg" id="caseNoteMsg"></div>
      </div>
    </div>
  </div>
</div>

<div id="caseNoteModal" class="note-modal" hidden>
  <div class="note-modal-backdrop" id="caseNoteBackdrop"></div>
  <div class="note-modal-panel" role="dialog" aria-labelledby="caseNoteModalTitle">
    <div class="note-modal-title" id="caseNoteModalTitle">解 卦 筆 記</div>
    <textarea id="caseNoteInput" class="note-modal-input" rows="10" placeholder="純文字筆記…" autocomplete="off"></textarea>
    <div class="note-modal-actions">
      <button type="button" class="btn-footer" id="caseNoteCancelBtn">取 消</button>
      <button type="button" class="btn-footer note-modal-save" id="caseNoteSaveBtn">儲 存</button>
    </div>
    <div class="save-history-msg" id="caseNoteModalMsg"></div>
  </div>
</div>

<div id="qimenModal" class="note-modal" hidden>
  <div class="note-modal-backdrop" id="qimenModalBackdrop"></div>
  <div class="note-modal-panel qimen-modal-panel" role="dialog" aria-labelledby="qimenModalTitle">
    <div class="note-modal-title qimen-modal-title" id="qimenModalTitle"></div>
    <div class="qimen-modal-body" id="qimenModalBody"></div>
    <div class="note-modal-actions">
      <button type="button" class="btn-footer note-modal-save" id="qimenModalCloseBtn">關 閉</button>
    </div>
    <div class="save-history-msg" id="qimenModalMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>

<script>
  const API_URL = 'https://feigong-yigua.davchan-clp.workers.dev';

  const LINE_NAMES = ['初', '二', '三', '四', '五', '上'];
  const OPTIONS = ['6', '7', '8', '9'];
  const CIRCLED_NUM = ['', '①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];
  const CIRCLED_ALPHA = ['', 'Ⓐ', 'Ⓑ', 'Ⓒ', 'Ⓓ', 'Ⓔ', 'Ⓕ', 'Ⓖ', 'Ⓗ'];

  const ZHI_LAYOUT = [
    { zhi: '巳', row: 1, col: 2 },
    { zhi: '午', row: 1, col: 3 },
    { zhi: '未', row: 1, col: 4 },
    { zhi: '辰', row: 2, col: 1 },
    { zhi: '申', row: 2, col: 5 },
    { zhi: '卯', row: 3, col: 1 },
    { zhi: '酉', row: 3, col: 5 },
    { zhi: '寅', row: 4, col: 1 },
    { zhi: '戌', row: 4, col: 5 },
    { zhi: '丑', row: 5, col: 2 },
    { zhi: '子', row: 5, col: 3 },
    { zhi: '亥', row: 5, col: 4 }
  ];

  const PALACE_LAYOUT = [
    { name: '巽', row: 2, col: 2 },
    { name: '離', row: 2, col: 3 },
    { name: '坤', row: 2, col: 4 },
    { name: '震', row: 3, col: 2 },
    { name: '中', row: 3, col: 3 },
    { name: '兌', row: 3, col: 4 },
    { name: '艮', row: 4, col: 2 },
    { name: '坎', row: 4, col: 3 },
    { name: '乾', row: 4, col: 4 }
  ];

  const TIAN_GAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
  const DI_ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

  // 奇門顯示用（起盤規則在 Worker）
  const PALACE_NUM = {
    坎: 1, 坤: 2, 震: 3, 巽: 4, 中: 5, 乾: 6, 兌: 7, 艮: 8, 離: 9
  };
  const PALACE_NUM_CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const PALACE_NAME_BY_NUM = {
    1: '坎', 2: '坤', 3: '震', 4: '巽', 5: '中', 6: '乾', 7: '兌', 8: '艮', 9: '離'
  };

  function getHourZhiIndex(hour) {
    return Math.floor(((hour + 1) % 24) / 2);
  }

  function getHourGanZhi(dayGanIdx, hour) {
    const zhiIdx = getHourZhiIndex(hour);
    const startGan = [0, 2, 4, 6, 8, 0, 2, 4, 6, 8][dayGanIdx];
    const ganIdx = (startGan + zhiIdx) % 10;
    return {
      gan: TIAN_GAN[ganIdx],
      zhi: DI_ZHI[zhiIdx],
      ganIdx,
      zhiIdx,
      label: TIAN_GAN[ganIdx] + DI_ZHI[zhiIdx]
    };
  }

  async function fetchQimenPan(dunLabel, hourGZ) {
    if (!dunLabel || !hourGZ) return null;
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'qimen',
        dunLabel,
        hourGZ: {
          gan: hourGZ.gan,
          zhi: hourGZ.zhi,
          ganIdx: hourGZ.ganIdx,
          zhiIdx: hourGZ.zhiIdx,
          label: hourGZ.label
        }
      })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || '奇門起盤失敗');
    return data;
  }

  function qimenDoorLabel(door) {
    if (!door) return '';
    return door.endsWith('門') ? door : door + '門';
  }

  // 神／星／門／干五行：金橙黃、木綠、水藍、火紅、土啡
  const QIMEN_WUXING = {
    值符: 'tu', 騰蛇: 'huo', 太陰: 'jin', 六合: 'mu',
    白虎: 'jin', 玄武: 'shui', 勾陳: 'tu', 朱雀: 'huo',
    九地: 'tu', 九天: 'jin',
    天蓬: 'shui', 天芮: 'tu', 天沖: 'mu', 天輔: 'mu',
    天心: 'jin', 天柱: 'jin', 天任: 'tu', 天英: 'huo',
    休: 'shui', 生: 'tu', 傷: 'mu', 杜: 'mu',
    景: 'huo', 死: 'tu', 驚: 'jin', 開: 'jin',
    休門: 'shui', 生門: 'tu', 傷門: 'mu', 杜門: 'mu',
    景門: 'huo', 死門: 'tu', 驚門: 'jin', 開門: 'jin',
    甲: 'mu', 乙: 'mu', 丙: 'huo', 丁: 'huo',
    戊: 'tu', 己: 'tu', 庚: 'jin', 辛: 'jin',
    壬: 'shui', 癸: 'shui',
    // 九宮卦名五行（與盤面色一致）
    坎: 'shui', 坤: 'tu', 震: 'mu', 巽: 'mu',
    中: 'tu', 乾: 'jin', 兌: 'jin', 艮: 'tu', 離: 'huo'
  };

  function qimenWuxing(name) {
    if (!name) return '';
    return QIMEN_WUXING[name] || QIMEN_WUXING[name.replace(/門$/, '')] || '';
  }

  function chainLastPalace(chain) {
    if (!Array.isArray(chain) || chain.length === 0) return '';
    const last = chain[chain.length - 1];
    return (last && last.palace) || '';
  }

  function renderQimenStems(tianText, diText) {
    const row = document.createElement('div');
    row.className = 'qimen-stems';
    if (tianText) {
      const tian = document.createElement('span');
      tian.className = 'qimen-tian';
      const tianWx = qimenWuxing(tianText);
      if (tianWx) tian.dataset.wx = tianWx;
      tian.textContent = tianText;
      row.appendChild(tian);
    }
    if (diText) {
      const di = document.createElement('span');
      di.className = 'qimen-di';
      const diWx = qimenWuxing(diText);
      if (diWx) di.dataset.wx = diWx;
      di.textContent = diText;
      row.appendChild(di);
    }
    return row;
  }

  function renderQimenCell(c, marks) {
    const div = document.createElement('div');
    div.className = 'qimen-cell' + (c.empty ? ' qimen-center' : '');
    div.dataset.palace = c.name;
    if (c.tian) div.dataset.tian = c.tian;
    if (c.di) div.dataset.di = c.di;
    if (c.god) div.dataset.god = c.god;
    if (c.star) div.dataset.star = c.star;
    if (c.door) div.dataset.door = c.door;
    let role = '';
    if (marks && marks.zuofang && marks.zuofang === c.name) {
      div.classList.add('qimen-zuofang');
      role = 'zuofang';
    }
    if (marks && marks.xiangfang && marks.xiangfang === c.name) {
      div.classList.add('qimen-xiangfang');
      role = role ? 'both' : 'xiangfang';
    }
    if (role) {
      div.classList.add('qimen-modal-hot');
      div.dataset.qimenRole = role;
      div.title = '連按三下查看奇門';
    }

    if (c.empty) {
      if (c.di) div.appendChild(renderQimenStems('', c.di));
      return div;
    }

    const god = document.createElement('div');
    god.className = 'qimen-god';
    const godWx = qimenWuxing(c.god);
    if (godWx) god.dataset.wx = godWx;
    god.textContent = c.god || '';
    div.appendChild(god);

    const star = document.createElement('div');
    star.className = 'qimen-star';
    const starWx = qimenWuxing(c.star);
    if (starWx) star.dataset.wx = starWx;
    star.textContent = c.star || '';
    div.appendChild(star);

    const door = document.createElement('div');
    door.className = 'qimen-door';
    const doorWx = qimenWuxing(c.door);
    if (doorWx) door.dataset.wx = doorWx;
    door.textContent = qimenDoorLabel(c.door);
    div.appendChild(door);

    div.appendChild(renderQimenStems(c.tian, c.di));
    return div;
  }

  async function renderQimenBoard(dunLabel, hourGZ, wrapEl, titleEl, xunKongList, marks) {
    if (!wrapEl) return false;
    wrapEl.innerHTML = '';
    if (titleEl) titleEl.textContent = '奇 門 局';
    if (!dunLabel) return false;
    if (!hourGZ) {
      const err = document.createElement('div');
      err.className = 'qimen-meta';
      err.textContent = '奇門起盤失敗：無法解析時柱';
      wrapEl.appendChild(err);
      return true;
    }

    let pan;
    try {
      pan = await fetchQimenPan(dunLabel, hourGZ);
    } catch (e) {
      const err = document.createElement('div');
      err.className = 'qimen-meta';
      err.textContent = '奇門起盤失敗：' + e.message;
      wrapEl.appendChild(err);
      return true;
    }
    if (!pan || !pan.cells || !pan.meta) return false;

    const fuGong = PALACE_NAME_BY_NUM[pan.meta.fuLinPalace] || '';
    const shiGong = PALACE_NAME_BY_NUM[pan.meta.doorLinPalace] || '';
    const shiGongNum = PALACE_NUM_CN[pan.meta.doorLinPalace] || '';
    const fuGongNum = PALACE_NUM_CN[pan.meta.fuLinPalace] || '';
    const meta = document.createElement('div');
    meta.className = 'qimen-meta';
    meta.innerHTML =
      `${pan.meta.dunLabel} · 時家轉盤·置閏 · 時柱${pan.meta.hourLabel}<br>` +
      `值符 ${pan.meta.xunLabel} ${pan.meta.zhiFu}落${fuGong}${fuGongNum}宮　` +
      `值使 ${pan.meta.zhiShi}門落${shiGong}${shiGongNum}宮`;
    wrapEl.appendChild(meta);

    const board = document.createElement('div');
    board.className = 'qimen-board';

    ZHI_LAYOUT.forEach(item => {
      const zhi = document.createElement('div');
      zhi.className = 'zhi';
      zhi.dataset.zhi = item.zhi;
      zhi.textContent = item.zhi;
      zhi.style.gridRow = String(item.row);
      zhi.style.gridColumn = String(item.col);
      board.appendChild(zhi);
    });

    const highlight = marks || {};
    PALACE_LAYOUT.forEach(item => {
      const num = PALACE_NUM[item.name];
      const cellData = pan.cells[num] || pan.cells[String(num)];
      const cell = renderQimenCell(cellData || {
        name: item.name, num, god: '', star: '', tian: '', di: '', door: '', empty: item.name === '中'
      }, highlight);
      cell.style.gridRow = String(item.row);
      cell.style.gridColumn = String(item.col);
      board.appendChild(cell);
    });

    wrapEl.appendChild(board);
    updateXunKongDisplay(board, xunKongList !== undefined ? xunKongList : currentXunKong);
    bindQimenModalHotspots(board);
    return true;
  }

  function closeQimenModal() {
    const modal = document.getElementById('qimenModal');
    if (modal) modal.hidden = true;
    const msg = document.getElementById('qimenModalMsg');
    if (msg) msg.textContent = '';
    const body = document.getElementById('qimenModalBody');
    if (body) body.innerHTML = '';
    const titleEl = document.getElementById('qimenModalTitle');
    if (titleEl) titleEl.textContent = '';
  }

  function setQimenModalTitle(role, palace) {
    const titleEl = document.getElementById('qimenModalTitle');
    if (!titleEl) return;
    let prefix = '坐方宮';
    if (role === 'xiangfang') prefix = '向方宮';
    else if (role === 'both') prefix = '坐方／向方宮';
    titleEl.textContent = '';
    titleEl.appendChild(document.createTextNode(prefix + '．'));
    const span = document.createElement('span');
    span.className = 'qimen-modal-palace';
    const wx = qimenWuxing(palace);
    if (wx) span.dataset.wx = wx;
    span.textContent = palace || '';
    titleEl.appendChild(span);
    titleEl.appendChild(document.createTextNode('宮'));
  }

  function makeQimenWxLine(className, text, wxSource) {
    const el = document.createElement('div');
    el.className = className;
    const wx = qimenWuxing(wxSource || text);
    if (wx) el.dataset.wx = wx;
    el.textContent = text || '';
    return el;
  }

  function packQimenGejuSixteen(name, poem) {
    return (String(name || '') + String(poem || '')).replace(/\s+/g, '').slice(0, 16);
  }

  function renderQimenGejuSixteen(name, poem) {
    const wrap = document.createElement('div');
    wrap.className = 'qimen-modal-geju';
    wrap.textContent = packQimenGejuSixteen(name, poem);
    return wrap;
  }

  function fillQimenModalBoard(bodyEl, cellInfo, gejuName, gejuPoem) {
    if (!bodyEl) return;
    bodyEl.innerHTML = '';
    bodyEl.appendChild(makeQimenWxLine('qimen-god', cellInfo.god || '', cellInfo.god));
    bodyEl.appendChild(makeQimenWxLine('qimen-star', cellInfo.star || '', cellInfo.star));
    bodyEl.appendChild(makeQimenWxLine(
      'qimen-door',
      qimenDoorLabel(cellInfo.door || ''),
      cellInfo.door
    ));
    const stems = renderQimenStems(cellInfo.tian || '', cellInfo.di || '');
    stems.classList.add('qimen-modal-stems');
    bodyEl.appendChild(stems);
    bodyEl.appendChild(renderQimenGejuSixteen(gejuName, gejuPoem));
  }

  async function openQimenModal(cell) {
    const modal = document.getElementById('qimenModal');
    const bodyEl = document.getElementById('qimenModalBody');
    const msgEl = document.getElementById('qimenModalMsg');
    if (!modal || !bodyEl || !cell) return;

    const cellInfo = {
      tian: cell.dataset.tian || '',
      di: cell.dataset.di || '',
      god: cell.dataset.god || '',
      star: cell.dataset.star || '',
      door: cell.dataset.door || '',
      role: cell.dataset.qimenRole || '',
      palace: cell.dataset.palace || ''
    };

  const QIMEN_MODAL_TAP_MS = 550;

  function registerQimenModalTap(cell) {
    if (!cell) return;
    if (qimenModalTapState.el !== cell) {
      qimenModalTapState.el = cell;
      qimenModalTapState.count = 1;
    } else {
      qimenModalTapState.count += 1;
    }
    if (qimenModalTapState.timer) clearTimeout(qimenModalTapState.timer);
    if (qimenModalTapState.count >= 3) {
      qimenModalTapState.el = null;
      qimenModalTapState.count = 0;
      qimenModalTapState.timer = null;
      openQimenModal(cell);
      return;
    }
    qimenModalTapState.timer = setTimeout(() => {
      qimenModalTapState.el = null;
      qimenModalTapState.count = 0;
      qimenModalTapState.timer = null;
    }, QIMEN_MODAL_TAP_MS);

  function bindQimenModalHotspots(board) {
    if (!board) return;
    board.querySelectorAll('.qimen-modal-hot').forEach((cell) => {
      cell.addEventListener('touchend', (e) => {
        if (e.changedTouches && e.changedTouches.length !== 1) return;
        qimenModalTapState.lastTouch = Date.now();
        registerQimenModalTap(cell);
        e.preventDefault();
      }, { passive: false });
      cell.addEventListener('click', (e) => {
        if (Date.now() - qimenModalTapState.lastTouch < QIMEN_MODAL_TAP_MS) {
          e.preventDefault();
          return;
        }
        registerQimenModalTap(cell);
      });
    });

  function linesToTrigramNum(lines) {

  function formatPoem(poem) {
    if (!poem || !poem.trim()) return '';
    const lines = poem.split('\n').filter(l => l.trim());
    const merged = [];
    for (let i = 0; i < lines.length; i += 2) {
      if (i + 1 < lines.length) {
        merged.push(lines[i].trim() + '　' + lines[i+1].trim());
      } else {
        merged.push(lines[i].trim());
      }
    }
    return merged.join('\n');
  }

  function getDayGanZhi(date) {
    const base = new Date(Date.UTC(1900, 0, 1));
    const target = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const diffDays = Math.round((target - base) / 86400000);
    const ganIdx = ((0 + diffDays) % 10 + 10) % 10;
    const zhiIdx = ((10 + diffDays) % 12 + 12) % 12;
    return { gan: TIAN_GAN[ganIdx], zhi: DI_ZHI[zhiIdx], ganIdx, zhiIdx };
  }

  function getXunKong(dayGanZhi) {
    const ganIdx = dayGanZhi.ganIdx;
    const zhiIdx = dayGanZhi.zhiIdx;
    const xunShouZhi = ((zhiIdx - ganIdx) % 12 + 12) % 12;
    const xunKongMap = {
      0: ['戌','亥'], 10: ['申','酉'], 8: ['午','未'],
      6: ['辰','巳'], 4: ['寅','卯'], 2: ['子','丑']
    };
    return xunKongMap[xunShouZhi] || [];
  }

  function equationOfTime(date) {
    const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    const B = (360 / 365) * (dayOfYear - 81) * Math.PI / 180;
    return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  }

  function calcTrueSolarTime(date, lon) {
    const lonCorrection = (lon - 120) * 4;
    const eot = equationOfTime(date);
    const totalCorrectionMin = lonCorrection + eot;
    const result = new Date(date.getTime() + totalCorrectionMin * 60000);
    return { time: result, correctionMin: totalCorrectionMin, lonCorrection, eot };
  }

  const GEO_CACHE_KEY = 'feigong_geo_cache_v1';

  }
  function saveGeoCache(cache) {

  }

  async function queryCityLon(cityName) {
    const cache = loadGeoCache();
    const key = cityName.trim().toLowerCase();
    if (cache[key]) return cache[key];
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(cityName);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('地理查詢失敗');
    const data = await res.json();
    if (!data || data.length === 0) throw new Error('找不到該城市');
    const result = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), displayName: data[0].display_name };
    cache[key] = result;
    saveGeoCache(cache);
    return result;
  }

  function jieQiJD(year, type) {
    const Y = (year - 2000) / 1000;
    const terms = {
      summer: [
        2451716.56767, 365241.62603, 0.00325, 0.00888, -0.00030,
        -0.00030, 0.00007, -0.00002, -0.00002, 0.00001
      ],
      winter: [
        2451900.05952, 365242.74049, -0.06223, -0.00823, 0.00032,
        0.00025, -0.00007, 0.00003, 0.00001, -0.00001
      ]
    };
    const t = type === 1 ? terms.summer : terms.winter;
    const JDE0 = t[0] + t[1] * Y + (t[2] + t[3] * Y) * Y * Y
      + (t[4] + t[5] * Y) * Y * Y * Y
      + (t[6] + t[7] * Y) * Y * Y * Y * Y
      + (t[8] + t[9] * Y) * Y * Y * Y * Y * Y;
    const deltaT = 69;
    return JDE0 - deltaT / 86400;
  }

  function jdToDate(jd) {
    const unixMs = (jd - 2440587.5) * 86400000;
    return new Date(unixMs);
  }

  function getSummerSolstice(year) { return jdToDate(jieQiJD(year, 1)); }
  function getWinterSolstice(year) { return jdToDate(jieQiJD(year, 3)); }

  function getDunType(date) {
    const year = date.getFullYear();
    const events = [];
    for (const y of [year - 1, year, year + 1]) {
      events.push({ name: '夏至', time: getSummerSolstice(y) });
      events.push({ name: '冬至', time: getWinterSolstice(y) });
    }
    events.sort((a, b) => a.time - b.time);
    const t = date.getTime();
    let lastEvent = null;
    for (const ev of events) {
      if (ev.time.getTime() <= t) lastEvent = ev;
      else break;
    }
    if (!lastEvent) return 'yang';
    return lastEvent.name === '冬至' ? 'yang' : 'yin';
  }

  function getShiChen(hour) {
    const zhiNames = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const idx = Math.floor(((hour + 1) % 24) / 2);

  function getShiChenNum(zhi) {
    const map = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 };

  async function updateInfo() {
    try {
      const cityName = cityInput.value.trim() || '香港';
      let geo;
      if (cityName === '香港' || cityName === 'Hong Kong') {
        geo = { lat: 22.32, lon: 114.17, displayName: '香港' };
      } else {
        geo = await queryCityLon(cityName);
      }
      currentLon = geo.lon;
      currentLat = geo.lat;

      const [y, mo, d] = dateInput.value.split('-').map(Number);
      const [hh, mm] = timeInput.value.split(':').map(Number);
      const stdTime = new Date(y, mo - 1, d, hh, mm, 0);

      const tst = calcTrueSolarTime(stdTime, currentLon);
      const tstHH = String(tst.time.getHours()).padStart(2, '0');
      const tstMM = String(tst.time.getMinutes()).padStart(2, '0');

      // 夜子時（23:00–23:59）：換日
      // 時辰仍用真太陽時（23 → 子時），但日柱、農曆用次日
      let effectiveDate = new Date(tst.time);
      if (tst.time.getHours() === 23) {
        effectiveDate = new Date(tst.time.getTime() + 3600000);
      }

      const shiChen = getShiChen(tst.time.getHours());
      const shiChenNum = getShiChenNum(shiChen);

      const dayGZ = getDayGanZhi(effectiveDate);
      currentXunKong = getXunKong(dayGZ);

      const lunar = Lunar.fromDate(effectiveDate);
      const lunarMonthNum = Math.abs(lunar.getMonth());
      const lunarDayNum = lunar.getDay();

      const yearGanZhi = lunar.getYearInGanZhiByLiChun();
      const yearZhi = yearGanZhi.charAt(1);
      const yearZhiNum = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 }[yearZhi];

      const sum = yearZhiNum + lunarMonthNum + lunarDayNum + shiChenNum;
      let remainder = sum % 9;
      if (remainder === 0) remainder = 9;

      const dunType = getDunType(tst.time);
      const dunLabel = (dunType === 'yang' ? '陽遁' : '陰遁') + remainder + '局';
      lastTrueSolarTime = `${tstHH}:${tstMM}`;
      lastDun = dunLabel;
      lastHourGZ = getHourGanZhi(dayGZ.ganIdx, tst.time.getHours());

      const corrStr = (tst.correctionMin >= 0 ? '+' : '') + tst.correctionMin.toFixed(1) + '分';
      infoReadout.innerHTML =
        `${yearGanZhi}年${lunarMonthNum}月${lunarDayNum}日${shiChen}時<br>` +
        `真太陽時：<span class="highlight">${tstHH}:${tstMM}</span>　校正：${corrStr}`;
      infoDun.textContent = dunLabel;

      syncDateTimeDisplays();
      infoSummaryText.textContent = `${formatDateDisplay(y, mo, d)} · ${formatTimeDisplay(hh, mm)} · ${cityName} · ${dunLabel}`;

      updateXunKongDisplay();
      const liveQimen = document.getElementById('qimenSection');
      if (liveQimen && liveQimen.style.display !== 'none') {
        await showQimenBoard(
          lastDun,
          lastHourGZ,
          liveQimen,
          document.getElementById('qimenWrap'),
          document.getElementById('qimenTitle'),
          currentXunKong,
          liveQimenMarks()
        );
      }
    } catch (e) {
      infoReadout.textContent = '（' + e.message + '）';
    }
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatCaseDateLabel(value) {
    if (value == null || value === '') return '';
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      if (value.getFullYear() < 1905) return '';
      return formatDateDisplay(value.getFullYear(), value.getMonth() + 1, value.getDate());
    }
    const s = String(value).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
      const [y, mo, d] = s.slice(0, 10).split('-').map(Number);
      if (![y, mo, d].some(n => Number.isNaN(n))) return formatDateDisplay(y, mo, d);
    }
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime()) && parsed.getFullYear() >= 1905) {
      return formatDateDisplay(parsed.getFullYear(), parsed.getMonth() + 1, parsed.getDate());
    }
    return '';
  }

  function formatCaseTimeLabel(value) {
    if (value == null || value === '') return '';
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      return formatTimeDisplay(value.getHours(), value.getMinutes());
    }
    const s = String(value).trim();
    const m = s.match(/(\d{1,2}):(\d{2})/);
    if (m) return formatTimeDisplay(Number(m[1]), Number(m[2]));
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime())) {
      return formatTimeDisplay(parsed.getHours(), parsed.getMinutes());
    }
    return s;
  }

  function parseRawSixLines(raw) {
    const text = String(raw == null ? '' : raw).trim();
    const chars = text.length === 6 ? text.split('') : text.split(/[,\s]+/).filter(Boolean);
    if (chars.length !== 6 || chars.some(c => !['6', '7', '8', '9'].includes(c))) {
      throw new Error('六爻資料不完整');
    }
    const sixLines = chars.map(getLineValue);
    const movingLineIndexes = [];
    chars.forEach((c, i) => { if (isMoving(c)) movingLineIndexes.push(i); });
    return { raw: chars, sixLines, movingLineIndexes };
  }

  function xunKongFromCaseDate(value, timeValue) {
    const ymd = parseCaseYMD(value);
    if (!ymd) return [];
    const hm = parseCaseHourMinute(timeValue || '');
    const hour = hm ? hm.hour : 12;
    const minute = hm ? hm.minute : 0;
    let effective = new Date(ymd.y, ymd.mo - 1, ymd.d, hour, minute, 0);
    if (hour === 23) {
      effective = new Date(effective.getTime() + 3600000);
    }
    return getXunKong(getDayGanZhi(effective));
  }

  function highlightQuestion(text, query) {
    const src = String(text == null || text === '' ? '（無問事）' : text);
    const q = String(query || '').trim();
    if (!q) return escapeHtml(src);
    const lower = src.toLowerCase();
    const qLower = q.toLowerCase();
    let out = '';
    let i = 0;
    while (i < src.length) {
      const idx = lower.indexOf(qLower, i);
      if (idx === -1) {
        out += escapeHtml(src.slice(i));
        break;
      }
      out += escapeHtml(src.slice(i, idx));
      out += '<u>' + escapeHtml(src.slice(idx, idx + q.length)) + '</u>';
      i = idx + q.length;
    }
    return out;
  }

  function parseCaseYMD(value) {
    if (value == null || value === '') return null;
    if (value instanceof Date && !Number.isNaN(value.getTime()) && value.getFullYear() >= 1905) {
      return { y: value.getFullYear(), mo: value.getMonth() + 1, d: value.getDate() };
    }
    const s = String(value).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return { y: Number(m[1]), mo: Number(m[2]), d: Number(m[3]) };
    m = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    if (m) {
      const mo = MONTH_ABBR.indexOf(m[2]) + 1;
      if (mo) return { y: Number(m[3]), mo, d: Number(m[1]) };
    }
    const label = formatCaseDateLabel(value);
    m = String(label).match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    if (m) {
      const mo = MONTH_ABBR.indexOf(m[2]) + 1;
      if (mo) return { y: Number(m[3]), mo, d: Number(m[1]) };
    }
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime()) && parsed.getFullYear() >= 1905) {
      return { y: parsed.getFullYear(), mo: parsed.getMonth() + 1, d: parsed.getDate() };
    }
    return null;
  }

  function parseCaseHourMinute(value) {
    if (value == null || value === '') return null;
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      return { hour: value.getHours(), minute: value.getMinutes() };
    }
    const s = String(value).trim();
    const m = s.match(/(\d{1,2}):(\d{2})/);
    if (m) return { hour: Number(m[1]), minute: Number(m[2]) };
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime())) {
      return { hour: parsed.getHours(), minute: parsed.getMinutes() };
    }
    return null;
  }

  function hourGZFromCaseItem(item) {
    const ymd = parseCaseYMD(item && item.date);
    if (!ymd) return null;
    const hm = parseCaseHourMinute((item && (item.trueSolarTime || item.time)) || '');
    if (!hm) return null;
    let effective = new Date(ymd.y, ymd.mo - 1, ymd.d, hm.hour, hm.minute, 0);
    if (hm.hour === 23) {
      effective = new Date(effective.getTime() + 3600000);
    }
    const dayGZ = getDayGanZhi(effective);
    return getHourGanZhi(dayGZ.ganIdx, hm.hour);
  }

  async function openCaseDetail(item) {
    hideSuggest();
    currentCaseItem = item;
    closeCaseNoteModal();
    const noteMsg = document.getElementById('caseNoteMsg');
    if (noteMsg) noteMsg.textContent = '';
    caseDetail.hidden = false;
    caseSearchStatus.textContent = '載入排盤…';
    caseChainSection.style.display = 'none';
    casePangtongSection.style.display = 'none';
    caseChuleiSection.style.display = 'none';
    hideQimenBoard(caseQimenSection, caseQimenWrap, caseQimenTitle);
    caseChainList.innerHTML = '';
    casePangtongList.innerHTML = '';
    caseChuleiList.innerHTML = '';

    const question = item.question || '（無問事）';
    const clock = formatCaseTimeLabel(item.time);
    const solar = formatCaseTimeLabel(item.trueSolarTime);
    let timePart = clock;
    if (solar) {
      timePart = clock ? `${clock}（${solar}）` : `（${solar}）`;
    }
    const metaLine = [
      formatCaseDateLabel(item.date),
      timePart,
      item.city || '',
      item.dunLabel || ''
    ].filter(Boolean).join(' · ');
    caseMeta.innerHTML =
      `<div class="case-meta-question">${escapeHtml(question)}</div>` +
      (metaLine ? `<div class="case-meta-line">${escapeHtml(metaLine)}</div>` : '');

    try {
      const parsed = parseRawSixLines(item.sixLines);
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'cast',
          sixLines: parsed.sixLines,
          movingLineIndexes: parsed.movingLineIndexes
        })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || '起卦失敗');

      const benLines = data.ben ? data.ben.lines : parsed.sixLines;
      const chgLines = data.changed ? data.changed.lines : parsed.sixLines;
      renderSixLines(benLines, caseBenLines);
      renderSixLines(chgLines, caseChgLines);
      caseBenName.textContent = (data.ben && data.ben.name) || item.benName || getHexNameFromSixLines(benLines);
      caseChgName.textContent = (data.changed && data.changed.name) || item.chgName || getHexNameFromSixLines(chgLines);

      if (data.sixiang) {
        caseSixiangText.textContent = data.sixiang.text;
        caseSixiangSection.style.display = 'block';
      } else {
        caseSixiangSection.style.display = 'none';
      }

      casePalaces = data.palaces;
      const startPalace = item.startPalace;
      const caseHourGZ = hourGZFromCaseItem(item);
      const caseXunKong = xunKongFromCaseDate(item.date, item.trueSolarTime || item.time);
      renderBagua(casePalaces, {
        wrap: caseBaguaWrap,
        interactive: false,
        xunKong: caseXunKong
      });
      caseBaguaWrap.classList.add('case-bagua-locked');

      if (startPalace) {
        const sel = caseBaguaWrap.querySelector(`.palace[data-palace="${startPalace}"]`);
        if (sel) {
          sel.classList.add('selected', 'yongshen');
        }
        await fillCaseChains(
          startPalace,
          casePalaces,
          item.dunLabel,
          caseHourGZ,
          caseXunKong
        );
      } else if (item.dunLabel) {
        await showQimenBoard(
          item.dunLabel,
          caseHourGZ,
          caseQimenSection,
          caseQimenWrap,
          caseQimenTitle,
          caseXunKong,
          { zuofang: '', xiangfang: '' }
        );
      }

      caseSearchStatus.textContent = '';
    } catch (e) {
      caseSearchStatus.textContent = '載入失敗：' + e.message;
    }
  }

  async function searchCases(query) {
    const seq = ++caseSearchSeq;
    lastCaseQuery = query;
    caseSearchStatus.textContent = '搜尋中…';
    caseItemsCache = [];
    hideSuggest();
    caseDetail.hidden = true;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'searchHistory', query })
      });
      const data = await res.json();
      if (seq !== caseSearchSeq) return;
      if (!res.ok || data.error) {
        caseSearchStatus.textContent = data.error || '搜尋失敗';
        return;
      }
      caseItemsCache = Array.isArray(data.items) ? data.items : [];
      if (caseItemsCache.length === 0) {
        caseSearchStatus.textContent = '沒有符合的卦例';
        return;
      }
      caseSearchStatus.textContent = '';
      showSuggest(caseItemsCache, query);
    } catch (e) {
      if (seq !== caseSearchSeq) return;
      caseSearchStatus.textContent = '連線失敗：' + e.message;
    }
  }

  if (menuBtn) {
    menuBtn.addEventListener('click', () => setViewMode(!showingCases));
  }

  if (caseBackBtn) {
    caseBackBtn.addEventListener('click', () => {
      caseDetail.hidden = true;
      currentCaseItem = null;
      closeCaseNoteModal();
      caseSearchStatus.textContent = '';
      const noteMsg = document.getElementById('caseNoteMsg');
      if (noteMsg) noteMsg.textContent = '';
      if (caseItemsCache.length && lastCaseQuery) {
        showSuggest(caseItemsCache, lastCaseQuery);
      }
      caseSearchInput.focus();
    });
  }

  const caseScreenshotBtn = document.getElementById('caseScreenshotBtn');
  if (caseScreenshotBtn) {
    caseScreenshotBtn.addEventListener('click', async () => {
      const footer = document.getElementById('caseFooterActions');
      if (footer) footer.style.display = 'none';
      try {
        await captureElementToPreview(
          document.getElementById('caseCaptureRoot'),
          caseScreenshotBtn
        );
      } catch (e) {
        alert('生成失敗：' + e.message);
      } finally {
        if (footer) footer.style.display = '';
      }
    });
  }

  const caseNoteBtn = document.getElementById('caseNoteBtn');
  if (caseNoteBtn) {
    caseNoteBtn.addEventListener('click', () => openCaseNoteModal());
  }

  const caseNoteCancelBtn = document.getElementById('caseNoteCancelBtn');
  if (caseNoteCancelBtn) {
    caseNoteCancelBtn.addEventListener('click', () => closeCaseNoteModal());
  }

  const caseNoteBackdrop = document.getElementById('caseNoteBackdrop');
  if (caseNoteBackdrop) {
    caseNoteBackdrop.addEventListener('click', () => closeCaseNoteModal());
  }

  const caseNoteSaveBtn = document.getElementById('caseNoteSaveBtn');
  if (caseNoteSaveBtn) {
    caseNoteSaveBtn.addEventListener('click', async () => {
      const input = document.getElementById('caseNoteInput');
      const modalMsg = document.getElementById('caseNoteModalMsg');
      const footerMsg = document.getElementById('caseNoteMsg');
      if (!currentCaseItem || !currentCaseItem.sheetRow) {
        if (modalMsg) modalMsg.textContent = '無法對應 Sheet 列';
        return;
      }
      const note = input ? input.value : '';
      caseNoteSaveBtn.disabled = true;
      caseNoteSaveBtn.textContent = '儲 存 中…';
      if (modalMsg) modalMsg.textContent = '';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'saveNote',
            sheetRow: currentCaseItem.sheetRow,
            note
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          if (modalMsg) modalMsg.textContent = data.error || '儲存失敗';
          return;
        }
        currentCaseItem.note = data.note == null ? note : String(data.note);
        const cached = caseItemsCache.find(
          (it) => it && it.sheetRow === currentCaseItem.sheetRow
        );
        if (cached) cached.note = currentCaseItem.note;
        closeCaseNoteModal();
        if (footerMsg) footerMsg.textContent = '筆記已儲存';
      } catch (e) {
        if (modalMsg) modalMsg.textContent = '連線失敗：' + e.message;
      } finally {
        caseNoteSaveBtn.disabled = false;
        caseNoteSaveBtn.textContent = '儲 存';
      }
    });
  }

  if (caseSuggest) {
    caseSuggest.addEventListener('click', (e) => {
      const btn = e.target.closest('.case-suggest-item');
      if (!btn) return;
      const idx = parseInt(btn.dataset.caseIndex, 10);
      const item = caseItemsCache[idx];
      if (item) openCaseDetail(item);
    });
  }

  if (caseSearchInput) {
    caseSearchInput.addEventListener('input', () => {
      const query = caseSearchInput.value.trim();
      if (caseSearchTimer) clearTimeout(caseSearchTimer);
      if (!query) {
        caseSearchSeq += 1;
        resetCaseView();
        return;
      }
      caseSearchTimer = setTimeout(() => searchCases(query), 350);
    });

    caseSearchInput.addEventListener('focus', () => {
      if (!caseDetail.hidden) return;
      if (caseItemsCache.length && lastCaseQuery && caseSearchInput.value.trim() === lastCaseQuery) {
        showSuggest(caseItemsCache, lastCaseQuery);
      }
    });
  }

  const qimenModalCloseBtn = document.getElementById('qimenModalCloseBtn');
  if (qimenModalCloseBtn) {
    qimenModalCloseBtn.addEventListener('click', () => closeQimenModal());
  }
  const qimenModalBackdrop = document.getElementById('qimenModalBackdrop');
  if (qimenModalBackdrop) {
    qimenModalBackdrop.addEventListener('click', () => closeQimenModal());
  }

  document.addEventListener('click', (e) => {
    if (!showingCases) return;
    if (e.target.closest('.case-search-wrap')) return;
    if (!caseSuggest.hidden) hideSuggest();
  });
</script>
</body>
</html>
