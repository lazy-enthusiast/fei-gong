<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>飛宮易卦</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #faf8f3;
      font-family: 'Noto Serif TC', 'Times New Roman', 'Microsoft JhengHei', serif;
      min-height: 100vh;
      padding: 0.4rem;
      color: #2a2a2a;
      font-size: 14px;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.4rem;
      text-align: center;
      color: #2a2a2a;
      padding-bottom: 0.3rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #d4cfc0;
    }

    /* ===== 上層：輸入 + 本卦 + 變卦（自適應三欄） ===== */
    .top-section {
      display: flex;
      gap: 0.4rem;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    /* 輸入區（固定寬度，不縮不脹） */
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 0 0 auto;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 30px;
    }

    .input-row label {
      width: 14px;
      font-size: 0.65rem;
      color: #8a8578;
      text-align: center;
      flex-shrink: 0;
    }

    .input-row select {
      width: 44px;
      height: 28px;
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 3px;
      padding: 0;
      font-size: 0.85rem;
      font-family: 'Menlo', 'Consolas', monospace;
      color: #2a2a2a;
      outline: none;
      text-align: center;
      text-align-last: center;
    }

    .input-row select:focus {
      border-color: #8a6d3b;
    }

    /* 本卦 / 變卦（自適應，平分剩餘空間） */
    .hex-result {
      display: flex;
      flex: 1;
      gap: 0.4rem;
      justify-content: space-around;
      min-width: 0;
    }

    .hex-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      flex: 1;
      min-width: 0;
    }

    .hex-box-title {
      font-size: 0.65rem;
      color: #8a8578;
      letter-spacing: 0.15rem;
    }

    .hex-box-lines {
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      align-items: center;
      width: 100%;
      max-width: 90px;
    }

    .hex-box-lines .line {
      width: 100%;
      height: 9px;
      display: flex;
      gap: 3px;
    }

    .hex-box-lines .bar-yang {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .hex-box-lines .yin-pair {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .hex-box-lines .half-bar {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    /* 卦名：橫排，在六爻圖下方 */
    .hex-box-name {
      font-size: 0.85rem;
      color: #2a2a2a;
      letter-spacing: 0.05rem;
      min-height: 1.1rem;
      text-align: center;
      white-space: nowrap;
    }

    /* 按鈕 */
    .btn {
      background: #2a2a2a;
      border: none;
      border-radius: 3px;
      padding: 0.5rem 1.5rem;
      font-size: 0.85rem;
      color: #faf8f3;
      letter-spacing: 0.3rem;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      margin-top: 0.2rem;
    }

    .btn:disabled {
      opacity: 0.4;
    }

    .error-msg {
      color: #a04a3a;
      font-size: 0.7rem;
      margin-top: 0.2rem;
      min-height: 0.9rem;
      text-align: center;
    }

    /* 九宮格 */
    .nine-grid-section {
      margin-top: 0.6rem;
      display: none;
    }

    .section-label {
      font-size: 0.65rem;
      color: #8a8578;
      letter-spacing: 0.2rem;
      text-align: center;
      margin-bottom: 0.3rem;
    }

    .nine-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      max-width: 270px;
      margin: 0 auto;
    }

    .palace {
      aspect-ratio: 1;
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      gap: 2px;
      padding: 2px;
    }

    .palace:active {
      background: #f5efe0;
    }

    .palace.selected {
      border-color: #8a6d3b;
      background: #f5efe0;
      box-shadow: 0 0 0 2px #8a6d3b44;
    }

    .palace.empty {
      cursor: default;
      opacity: 0.3;
      background: #f0ede6;
    }

    .palace-name {
      font-size: 0.65rem;
      color: #8a8578;
    }

    .palace-lines {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      align-items: center;
    }

    .palace-lines .line {
      width: 28px;
      height: 5px;
      display: flex;
      gap: 2px;
    }

    .palace-lines .bar-yang {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .palace-lines .yin-pair {
      display: flex;
      gap: 3px;
      width: 100%;
    }

    .palace-lines .half-bar {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    /* 飛宮鏈 */
    .chain-section {
      margin-top: 0.6rem;
      display: none;
    }

    .chain-item {
      background: #fff;
      border: 1px solid #d4cfc0;
      border-left: 3px solid #8a6d3b;
      border-radius: 4px;
      padding: 0.5rem 0.7rem;
      margin-bottom: 0.35rem;
    }

    .chain-item-name {
      font-size: 0.95rem;
      color: #2a2a2a;
      margin-bottom: 0.25rem;
    }

    .chain-item-poem {
      font-size: 0.78rem;
      color: #6a6458;
      line-height: 1.55;
      white-space: pre-line;
    }

    .chain-item-poem.empty {
      color: #b0aa9c;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>飛宮易卦</h1>

  <div class="top-section">
    <!-- 六爻輸入 -->
    <div class="input-area" id="inputArea"></div>

    <!-- 本卦變卦 -->
    <div class="hex-result">
      <div class="hex-box">
        <div class="hex-box-title">本卦</div>
        <div class="hex-box-lines" id="benLines"></div>
        <div class="hex-box-name" id="benName">—</div>
      </div>
      <div class="hex-box">
        <div class="hex-box-title">變卦</div>
        <div class="hex-box-lines" id="chgLines"></div>
        <div class="hex-box-name" id="chgName">—</div>
      </div>
    </div>
  </div>

  <button class="btn" id="castBtn">起 卦</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="nine-grid-section" id="nineGridSection">
    <div class="section-label">九 宮 格</div>
    <div class="nine-grid" id="nineGrid"></div>
  </div>

  <div class="chain-section" id="chainSection">
    <div class="section-label">飛 宮 鏈</div>
    <div id="chainList"></div>
  </div>
</div>

<script>
  const API_URL = 'https://feigong-yigua.davchan-clp.workers.dev';

  const LINE_NAMES = ['初', '二', '三', '四', '五', '上'];
  const OPTIONS = ['6', '7', '8', '9'];

  // 生成六爻輸入（上爻在最上、初爻在最下）
  const inputArea = document.getElementById('inputArea');
  for (let i = 5; i >= 0; i--) {
    const row = document.createElement('div');
    row.className = 'input-row';

    const label = document.createElement('label');
    label.textContent = LINE_NAMES[i];

    const select = document.createElement('select');
    select.dataset.index = i;
    OPTIONS.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
    select.value = '7';

    row.appendChild(label);
    row.appendChild(select);
    inputArea.appendChild(row);
  }

  function getLineValue(val) {
    return (val === '7' || val === '9') ? 1 : 0;
  }
  function isMoving(val) {
    return val === '6' || val === '9';
  }

  function getSixLinesInput() {
    const selects = document.querySelectorAll('#inputArea select');
    const sixLines = [];
    const movingLineIndexes = [];
    selects.forEach(sel => {
      const i = parseInt(sel.dataset.index);
      const val = sel.value;
      sixLines[i] = getLineValue(val);
      if (isMoving(val)) movingLineIndexes.push(i);
    });
    return { sixLines, movingLineIndexes };
  }

  function renderSixLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 5; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function renderTrigramLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 2; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function updateLive() {
    const { sixLines, movingLineIndexes } = getSixLinesInput();

    renderSixLines(sixLines, document.getElementById('benLines'));

    const chgLines = [...sixLines];
    movingLineIndexes.forEach(i => { chgLines[i] = chgLines[i] === 1 ? 0 : 1; });
    renderSixLines(chgLines, document.getElementById('chgLines'));

    document.getElementById('benName').textContent = '—';
    document.getElementById('chgName').textContent = '—';

    document.getElementById('nineGridSection').style.display = 'none';
    document.getElementById('chainSection').style.display = 'none';
  }

  document.querySelectorAll('#inputArea select').forEach(sel => {
    sel.addEventListener('change', updateLive);
  });

  updateLive();

  // 起卦
  const castBtn = document.getElementById('castBtn');
  const errorMsg = document.getElementById('errorMsg');
  const nineGridSection = document.getElementById('nineGridSection');
  const nineGrid = document.getElementById('nineGrid');
  const chainSection = document.getElementById('chainSection');
  const chainList = document.getElementById('chainList');

  let currentPalaces = null;

  castBtn.addEventListener('click', async () => {
    errorMsg.textContent = '';
    const { sixLines, movingLineIndexes } = getSixLinesInput();

    castBtn.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'cast',
          sixLines: sixLines,
          movingLineIndexes: movingLineIndexes
        })
      });
      const data = await res.json();
      if (data.error) {
        errorMsg.textContent = data.error;
        castBtn.disabled = false;
        return;
      }

      document.getElementById('benName').textContent = data.ben.name;
      document.getElementById('chgName').textContent = data.changed.name;

      currentPalaces = data.palaces;
      renderNineGrid(data.palaces);
      nineGridSection.style.display = 'block';

      chainSection.style.display = 'none';
      chainList.innerHTML = '';
    } catch (e) {
      errorMsg.textContent = '連線失敗：' + e.message;
    }
    castBtn.disabled = false;
  });

  function renderNineGrid(palaces) {
    nineGrid.innerHTML = '';
    const gridOrder = ['巽', '離', '坤', '震', '中', '兌', '艮', '坎', '乾'];

    gridOrder.forEach(pos => {
      const div = document.createElement('div');
      div.className = 'palace';

      if (pos === '中') {
        div.classList.add('empty');
        div.innerHTML = '<div class="palace-name">中</div>';
        nineGrid.appendChild(div);
        return;
      }

      const p = palaces[pos];
      if (!p) {
        div.classList.add('empty');
        nineGrid.appendChild(div);
        return;
      }

      div.innerHTML = `<div class="palace-name">${pos}</div>`;
      const linesDiv = document.createElement('div');
      linesDiv.className = 'palace-lines';
      renderTrigramLines(p.lines, linesDiv);
      div.appendChild(linesDiv);

      div.addEventListener('click', () => {
        document.querySelectorAll('.palace.selected').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        runFlyingChain(pos);
      });

      nineGrid.appendChild(div);
    });
  }

  async function runFlyingChain(startPalace) {
    if (!currentPalaces) return;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'fly',
          palaces: currentPalaces,
          startPalace: startPalace
        })
      });
      const data = await res.json();
      if (data.error) {
        errorMsg.textContent = data.error;
        return;
      }

      chainList.innerHTML = '';
      data.chain.forEach(item => {
        const div = document.createElement('div');
        div.className = 'chain-item';
        const poem = item.poem && item.poem.trim() ? item.poem : '（卦詩待補）';
        const poemClass = item.poem && item.poem.trim() ? '' : 'empty';
        div.innerHTML = `
          <div class="chain-item-name">${item.name}</div>
          <div class="chain-item-poem ${poemClass}">${poem}</div>
        `;
        chainList.appendChild(div);
      });

      chainSection.style.display = 'block';
    } catch (e) {
      errorMsg.textContent = '飛宮鏈失敗：' + e.message;
    }
  }
</script>
</body>
</html>
