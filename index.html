<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>飛宮易卦</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #faf8f3;
      font-family: 'Noto Serif TC', 'Times New Roman', 'Microsoft JhengHei', serif;
      min-height: 100vh;
      padding: 0.4rem;
      color: #2a2a2a;
      font-size: 14px;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0.5rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.4rem;
      text-align: center;
      color: #2a2a2a;
      padding-bottom: 0.25rem;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid #d4cfc0;
    }

    /* ===== 頂部：收起的摘要 ===== */
    .info-summary {
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 4px;
      padding: 0.45rem 0.6rem;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
      color: #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .info-summary .summary-text {
      flex: 1;
      text-align: center;
      font-size: 0.78rem;
      color: #6a6458;
    }

    .info-summary .toggle-icon {
      font-size: 0.7rem;
      color: #8a8578;
      transition: transform 0.2s;
    }

    .info-summary.expanded .toggle-icon {
      transform: rotate(180deg);
    }

    /* 展開的資訊面板 */
    .info-panel {
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 4px;
      padding: 0.5rem 0.6rem;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      display: none;
    }

    .info-panel.open {
      display: block;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.35rem;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-row label {
      width: 2.2rem;
      color: #8a8578;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .info-row input {
      flex: 1;
      min-width: 0;
      height: 26px;
      background: #faf8f3;
      border: 1px solid #d4cfc0;
      border-radius: 3px;
      padding: 0 0.4rem;
      font-size: 0.8rem;
      font-family: inherit;
      color: #2a2a2a;
      outline: none;
    }

    .info-row input:focus {
      border-color: #8a6d3b;
    }

    .info-readout {
      font-size: 0.72rem;
      color: #6a6458;
      line-height: 1.5;
      padding-top: 0.35rem;
      margin-top: 0.35rem;
      border-top: 1px dashed #d4cfc0;
      text-align: center;
    }

    .info-readout .highlight {
      color: #8a6d3b;
      font-weight: 600;
    }

    .nominatim-attr {
      font-size: 0.6rem;
      color: #b0aa9c;
      text-align: center;
      margin-top: 0.2rem;
    }

    /* ===== 上層 ===== */
    .top-section {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
      margin-bottom: 0.2rem;
      padding-left: 0.3rem;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 0 0 auto;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 30px;
    }

    .input-row label {
      width: 14px;
      font-size: 0.7rem;
      color: #8a8578;
      text-align: center;
      flex-shrink: 0;
    }

    .input-row select {
      width: 44px;
      height: 28px;
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 3px;
      padding: 0;
      font-size: 0.9rem;
      font-family: 'Menlo', 'Consolas', monospace;
      color: #2a2a2a;
      outline: none;
      text-align: center;
      text-align-last: center;
    }

    .input-row select:focus {
      border-color: #8a6d3b;
    }

    .hex-result {
      display: flex;
      flex: 1;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .hex-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      flex: 0 0 auto;
    }

    .hex-box-title {
      font-size: 0.7rem;
      color: #8a8578;
      letter-spacing: 0.15rem;
    }

    .hex-box-lines {
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      align-items: center;
      width: 100px;
    }

    .hex-box-lines .line {
      width: 100%;
      height: 10px;
      display: flex;
      gap: 4px;
    }

    .hex-box-lines .bar-yang {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .hex-box-lines .yin-pair {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .hex-box-lines .half-bar {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .hex-box-name {
      font-size: 1rem;
      color: #2a2a2a;
      letter-spacing: 0.05rem;
      min-height: 1.3rem;
      text-align: center;
      white-space: nowrap;
    }

    .btn {
      background: #2a2a2a;
      border: none;
      border-radius: 3px;
      padding: 0.55rem 1.5rem;
      font-size: 0.9rem;
      color: #faf8f3;
      letter-spacing: 0.3rem;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      margin-top: 0.1rem;
    }

    .btn:disabled {
      opacity: 0.4;
    }

    .error-msg {
      color: #a04a3a;
      font-size: 0.75rem;
      margin-top: 0.2rem;
      min-height: 0.9rem;
      text-align: center;
    }

    /* ===== 九宮格 + 地支 ===== */
    .nine-grid-section {
      margin-top: 0.3rem;
      display: none;
    }

    .bagua-wrap {
      display: grid;
      grid-template-columns: 22px 80px 80px 80px 22px;
      grid-template-rows: 22px 80px 80px 80px 22px;
      gap: 4px;
      justify-content: center;
      margin: 0 auto;
    }

    .zhi {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #6a6458;
      font-weight: 500;
      user-select: none;
    }

    .zhi.xunkong {
      color: #a04a3a;
      font-weight: 700;
    }

    .zhi.xunkong::before {
      content: '';
      position: absolute;
      width: 1.5rem;
      height: 1.5rem;
      border: 1.5px solid #a04a3a;
      border-radius: 50%;
      pointer-events: none;
    }

    .palace {
      position: relative;
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
    }

    .palace:active {
      background: #f5efe0;
    }

    .palace.selected {
      border-color: #8a6d3b;
      background: #f5efe0;
      box-shadow: 0 0 0 2px #8a6d3b44;
    }

    .palace.empty {
      cursor: default;
      opacity: 0.3;
      background: #f0ede6;
    }

    .palace-lines {
      display: flex;
      flex-direction: column-reverse;
      gap: 3px;
      align-items: center;
    }

    .palace-lines .line {
      width: 40px;
      height: 8px;
      display: flex;
      gap: 3px;
    }

    .palace-lines .bar-yang {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .palace-lines .yin-pair {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .palace-lines .half-bar {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .palace-number {
      position: absolute;
      bottom: 3px;
      left: 5px;
      font-size: 0.75rem;
      color: #8a6d3b;
      font-weight: 600;
      line-height: 1;
      pointer-events: none;
    }

    /* ===== 飛宮鏈 ===== */
    .chain-section {
      margin-top: 0.4rem;
      display: none;
    }

    .chain-title {
      font-size: 1rem;
      color: #2a2a2a;
      letter-spacing: 0.15rem;
      text-align: left;
      padding-bottom: 0.25rem;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid #d4cfc0;
    }

    .chain-item {
      background: #fff;
      border: 1px solid #d4cfc0;
      border-left: 3px solid #8a6d3b;
      border-radius: 4px;
      padding: 0.5rem 0.7rem;
      margin-bottom: 0.3rem;
    }

    .chain-item-name {
      font-size: 1.15rem;
      color: #2a2a2a;
      margin-bottom: 0.3rem;
    }

    .chain-item-poem {
      font-size: 0.9rem;
      color: #6a6458;
      line-height: 1.7;
      white-space: pre-line;
    }

    .chain-item-poem.empty {
      color: #b0aa9c;
      font-style: italic;
    }

    /* 遁局顯示 */
    .dunju-display {
      text-align: center;
      font-size: 0.95rem;
      color: #8a6d3b;
      font-weight: 600;
      letter-spacing: 0.15rem;
      margin-top: 0.3rem;
      padding-top: 0.3rem;
      border-top: 1px dashed #d4cfc0;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>飛宮易卦</h1>

  <!-- 頂部摘要（收起時顯示） -->
  <div class="info-summary" id="infoSummary">
    <span class="summary-text" id="summaryText">2026-10-10 · 22:12 · 香港</span>
    <span class="toggle-icon">▼</span>
  </div>

  <!-- 展開的資訊面板 -->
  <div class="info-panel" id="infoPanel">
    <div class="info-row">
      <label>日期</label>
      <input type="date" id="dateInput">
    </div>
    <div class="info-row">
      <label>時間</label>
      <input type="time" id="timeInput">
    </div>
    <div class="info-row">
      <label>城市</label>
      <input type="text" id="cityInput" value="香港" placeholder="輸入城市名">
    </div>
    <div class="info-readout" id="infoReadout"></div>
    <div class="dunju-display" id="dunjuDisplay"></div>
    <div class="nominatim-attr">地理位置數據 © OpenStreetMap contributors</div>
  </div>

  <div class="top-section">
    <div class="input-area" id="inputArea"></div>

    <div class="hex-result">
      <div class="hex-box">
        <div class="hex-box-title">本卦</div>
        <div class="hex-box-lines" id="benLines"></div>
        <div class="hex-box-name" id="benName">—</div>
      </div>
      <div class="hex-box">
        <div class="hex-box-title">變卦</div>
        <div class="hex-box-lines" id="chgLines"></div>
        <div class="hex-box-name" id="chgName">—</div>
      </div>
    </div>
  </div>

  <button class="btn" id="castBtn">起 卦</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="nine-grid-section" id="nineGridSection">
    <div class="bagua-wrap" id="baguaWrap"></div>
  </div>

  <div class="chain-section" id="chainSection">
    <div class="chain-title">正 推</div>
    <div id="chainList"></div>
  </div>
</div>

<!-- lunar-javascript -->
<script src="https://g.alicdn.com/code/lib/lunar-javascript/1.6.4/lunar.min.js"></script>
<script>
  const API_URL = 'https://feigong-yigua.davchan-clp.workers.dev';

  const LINE_NAMES = ['初', '二', '三', '四', '五', '上'];
  const OPTIONS = ['6', '7', '8', '9'];
  const CIRCLED_NUM = ['', '①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];

  // ========== 九宮格佈局 ==========
  const ZHI_LAYOUT = [
    { zhi: '巳', row: 1, col: 2 },
    { zhi: '午', row: 1, col: 3 },
    { zhi: '未', row: 1, col: 4 },
    { zhi: '辰', row: 2, col: 1 },
    { zhi: '申', row: 2, col: 5 },
    { zhi: '卯', row: 3, col: 1 },
    { zhi: '酉', row: 3, col: 5 },
    { zhi: '寅', row: 4, col: 1 },
    { zhi: '戌', row: 4, col: 5 },
    { zhi: '丑', row: 5, col: 2 },
    { zhi: '子', row: 5, col: 3 },
    { zhi: '亥', row: 5, col: 4 }
  ];

  const PALACE_LAYOUT = [
    { name: '巽', row: 2, col: 2 },
    { name: '離', row: 2, col: 3 },
    { name: '坤', row: 2, col: 4 },
    { name: '震', row: 3, col: 2 },
    { name: '中', row: 3, col: 3 },
    { name: '兌', row: 3, col: 4 },
    { name: '艮', row: 4, col: 2 },
    { name: '坎', row: 4, col: 3 },
    { name: '乾', row: 4, col: 4 }
  ];

  // ========== 卦名數據 ==========
  const TRIGRAMS = {
    1: { name: '乾', lines: [1,1,1] },
    2: { name: '兌', lines: [1,1,0] },
    3: { name: '離', lines: [1,0,1] },
    4: { name: '震', lines: [1,0,0] },
    5: { name: '巽', lines: [0,1,1] },
    6: { name: '坎', lines: [0,1,0] },
    7: { name: '艮', lines: [0,0,1] },
    8: { name: '坤', lines: [0,0,0] }
  };

  const HEXAGRAM_NAMES = {
    '1_1':'乾為天','1_5':'天風姤','1_7':'天山遯','1_8':'天地否',
    '5_8':'風地觀','7_8':'山地剝','3_8':'火地晉','3_1':'火天大有',
    '2_2':'兌為澤','2_6':'澤水困','2_8':'澤地萃','2_7':'澤山咸',
    '6_7':'水山蹇','8_7':'地山謙','4_7':'雷山小過','4_2':'雷澤歸妹',
    '3_3':'離為火','3_7':'火山旅','3_5':'火風鼎','3_6':'火水未濟',
    '7_6':'山水蒙','5_6':'風水渙','1_6':'天水訟','1_3':'天火同人',
    '4_4':'震為雷','4_8':'雷地豫','4_6':'雷水解','4_5':'雷風恆',
    '8_5':'地風升','6_5':'水風井','2_5':'澤風大過','2_4':'澤雷隨',
    '5_5':'巽為風','5_1':'風天小畜','5_3':'風火家人','5_4':'風雷益',
    '1_4':'天雷無妄','3_4':'火雷噬嗑','7_4':'山雷頤','7_5':'山風蠱',
    '6_6':'坎為水','6_2':'水澤節','6_4':'水雷屯','6_3':'水火既濟',
    '2_3':'澤火革','4_3':'雷火豐','8_3':'地火明夷','8_6':'地水師',
    '7_7':'艮為山','7_3':'山火賁','7_1':'山天大畜','7_2':'山澤損',
    '3_2':'火澤睽','1_2':'天澤履','5_2':'風澤中孚','5_7':'風山漸',
    '8_8':'坤為地','8_4':'地雷復','8_2':'地澤臨','8_1':'地天泰',
    '4_1':'雷天大壯','2_1':'澤天夬','6_1':'水天需','6_8':'水地比'
  };

  function linesToTrigramNum(lines) {
    for (let i = 1; i <= 8; i++) {
      const t = TRIGRAMS[i].lines;
      if (t[0] === lines[0] && t[1] === lines[1] && t[2] === lines[2]) return i;
    }
    return 1;
  }

  function getHexNameFromSixLines(sixLines) {
    const lower = [sixLines[0], sixLines[1], sixLines[2]];
    const upper = [sixLines[3], sixLines[4], sixLines[5]];
    const upperNum = linesToTrigramNum(upper);
    const lowerNum = linesToTrigramNum(lower);
    return HEXAGRAM_NAMES[`${upperNum}_${lowerNum}`] || '—';
  }

  function formatPoem(poem) {
    if (!poem || !poem.trim()) return '';
    const lines = poem.split('\n').filter(l => l.trim());
    const merged = [];
    for (let i = 0; i < lines.length; i += 2) {
      if (i + 1 < lines.length) {
        merged.push(lines[i].trim() + '　' + lines[i+1].trim());
      } else {
        merged.push(lines[i].trim());
      }
    }
    return merged.join('\n');
  }

  // ========== 頂部收合 ==========
  const infoSummary = document.getElementById('infoSummary');
  const infoPanel = document.getElementById('infoPanel');
  const summaryText = document.getElementById('summaryText');

  let panelOpen = false;
  infoSummary.addEventListener('click', () => {
    panelOpen = !panelOpen;
    infoPanel.classList.toggle('open', panelOpen);
    infoSummary.classList.toggle('expanded', panelOpen);
  });

  // ========== 輸入 ==========
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const cityInput = document.getElementById('cityInput');
  const infoReadout = document.getElementById('infoReadout');
  const dunjuDisplay = document.getElementById('dunjuDisplay');

  let currentLon = 114.17;
  let currentLat = 22.32;
  let currentXunKong = [];

  function initDateTime() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    dateInput.value = `${y}-${m}-${d}`;
    timeInput.value = `${hh}:${mm}`;
  }
  initDateTime();

  // ========== 干支 / 節氣 ==========
  const DI_ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const ZHI_NUM = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 };

  // 用 lunar-javascript 取年柱地支
  function getYearZhiFromLunar(solar) {
    try {
      const lunar = solar.getLunar();
      const yearInGanZhi = lunar.getYearInGanZhi();
      return yearInGanZhi.charAt(1); // 取地支（第二個字）
    } catch (e) {
      return null;
    }
  }

  // 用 lunar-javascript 取農曆月、日數字
  function getLunarMonthDay(solar) {
    try {
      const lunar = solar.getLunar();
      return {
        month: Math.abs(lunar.getMonth()), // 閏月取絕對值
        day: lunar.getDay()
      };
    } catch (e) {
      return null;
    }
  }

  // 時辰：由真太陽時決定
  // 子時 23:00-00:59, 丑時 01:00-02:59, ... 亥時 21:00-22:59
  function getShiChenNum(tst) {
    const h = tst.getHours();
    // 時辰 = floor((h + 1) / 2) % 12 + 1
    // 23,00 -> 子(1); 01,02 -> 丑(2); ... 21,22 -> 亥(12)
    let idx;
    if (h === 23) idx = 0;
    else if (h === 0) idx = 0;
    else idx = Math.floor((h + 1) / 2);
    // 驗證：1->1? 用另一種方式
    // 23 -> 子, 0 -> 子, 1-2 -> 丑, 3-4 -> 寅, 5-6 -> 卯, 7-8 -> 辰, 9-10 -> 巳, 11-12 -> 午, 13-14 -> 未, 15-16 -> 申, 17-18 -> 酉, 19-20 -> 戌, 21-22 -> 亥
    let zhiIdx;
    if (h === 23 || h === 0) zhiIdx = 0;
    else zhiIdx = Math.floor((h + 1) / 2);
    return zhiIdx + 1; // 子=1, 丑=2, ...
  }

  // 由節氣判斷是冬至後夏至前（陽遁）還是夏至後冬至前（陰遁）
  function isYangDun(solar) {
    try {
      const lunar = solar.getLunar();
      // 取當前日期前的最近一個節氣
      const jieQi = lunar.getPrevJieQi();
      if (!jieQi) return true;
      const jqName = jieQi.getName();
      // 冬至 -> 夏至為陽遁
      const yangDunJieQi = ['冬至','小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種'];
      const yinDunJieQi = ['夏至','小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪'];
      if (yangDunJieQi.includes(jqName)) return true;
      if (yinDunJieQi.includes(jqName)) return false;
      // 找不到，退回簡易判斷：以冬至和夏至為界
      const now = solar.getSolar().getJulianDay ? solar.getSolar().getJulianDay() : null;
      return true;
    } catch (e) {
      return true;
    }
  }

  // ========== 真太陽時 ==========
  function equationOfTime(date) {
    const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    const B = (360 / 365) * (dayOfYear - 81) * Math.PI / 180;
    return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  }

  function calcTrueSolarTime(date, lon) {
    const lonCorrection = (lon - 120) * 4;
    const eot = equationOfTime(date);
    const totalCorrectionMin = lonCorrection + eot;
    const result = new Date(date.getTime() + totalCorrectionMin * 60000);
    return { time: result, correctionMin: totalCorrectionMin, lonCorrection, eot };
  }

  // ========== 城市查詢 ==========
  const GEO_CACHE_KEY = 'feigong_geo_cache_v1';
  function loadGeoCache() {
    try { return JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveGeoCache(cache) {
    try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
  }
  async function queryCityLon(cityName) {
    const cache = loadGeoCache();
    const key = cityName.trim().toLowerCase();
    if (cache[key]) return cache[key];
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(cityName);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('地理查詢失敗');
    const data = await res.json();
    if (!data || data.length === 0) throw new Error('找不到該城市');
    const result = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), displayName: data[0].display_name };
    cache[key] = result;
    saveGeoCache(cache);
    return result;
  }

  // ========== 更新資訊 ==========
  async function updateInfo() {
    try {
      const cityName = cityInput.value.trim() || '香港';
      let geo;
      if (cityName === '香港' || cityName === 'Hong Kong') {
        geo = { lat: 22.32, lon: 114.17, displayName: '香港' };
      } else {
        geo = await queryCityLon(cityName);
      }
      currentLon = geo.lon;
      currentLat = geo.lat;

      const [y, mo, d] = dateInput.value.split('-').map(Number);
      const [hh, mm] = timeInput.value.split(':').map(Number);
      const stdTime = new Date(y, mo - 1, d, hh, mm, 0);

      const tst = calcTrueSolarTime(stdTime, currentLon);
      const tstHH = String(tst.time.getHours()).padStart(2, '0');
      const tstMM = String(tst.time.getMinutes()).padStart(2, '0');

      // 用 lunar-javascript
      const { Solar } = window;
      const solar = Solar.fromDate(stdTime);
      const lunar = solar.getLunar();

      const yearInGanZhi = lunar.getYearInGanZhi();
      const yearZhi = yearInGanZhi.charAt(1);
      const lunarMonth = Math.abs(lunar.getMonth());
      const lunarDay = lunar.getDay();
      const lunarMonthChinese = lunar.getMonthInChinese();
      const lunarDayChinese = lunar.getDayInChinese();

      // 時辰（由真太陽時）
      const shiChenNum = getShiChenNum(tst.time);
      const shiChenZhi = DI_ZHI[shiChenNum - 1];

      // 旬空（用日柱）
      const dayInGanZhi = lunar.getDayInGanZhi();
      const dayZhi = dayInGanZhi.charAt(1);
      const dayGan = dayInGanZhi.charAt(0);
      const dayGanIdx = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'].indexOf(dayGan);
      const dayZhiIdx = DI_ZHI.indexOf(dayZhi);
      const xunShouZhiIdx = ((dayZhiIdx - dayGanIdx) % 12 + 12) % 12;
      const xunKongMap = { 0: ['戌','亥'], 10: ['申','酉'], 8: ['午','未'], 6: ['辰','巳'], 4: ['寅','卯'], 2: ['子','丑'] };
      currentXunKong = xunKongMap[xunShouZhiIdx] || [];

      // 計算遁局
      const yearZhiNum = ZHI_NUM[yearZhi] || 1;
      const total = yearZhiNum + lunarMonth + lunarDay + shiChenNum;
      let remainder = total % 9;
      if (remainder === 0) remainder = 9;

      const yangDun = isYangDun(solar);
      const dunjuText = (yangDun ? '陽遁' : '陰遁') + remainder + '局';

      const corrStr = (tst.correctionMin >= 0 ? '+' : '') + tst.correctionMin.toFixed(1) + '分';

      infoReadout.innerHTML =
        `年柱：<span class="highlight">${yearInGanZhi}</span>　` +
        `農曆：<span class="highlight">${lunarMonthChinese}月${lunarDayChinese}</span>　` +
        `時辰：<span class="highlight">${shiChenZhi}時</span><br>` +
        `真太陽時：<span class="highlight">${tstHH}:${tstMM}</span>　` +
        `校正：${corrStr}`;

      dunjuDisplay.textContent = dunjuText;

      // 更新摘要
      const summaryDate = dateInput.value;
      const summaryTime = timeInput.value;
      summaryText.textContent = `${summaryDate} · ${summaryTime} · ${cityName}`;

      updateXunKongDisplay();
    } catch (e) {
      infoReadout.textContent = '（' + e.message + '）';
      dunjuDisplay.textContent = '';
    }
  }

  dateInput.addEventListener('change', updateInfo);
  timeInput.addEventListener('change', updateInfo);
  cityInput.addEventListener('change', updateInfo);

  // ========== 六爻輸入 ==========
  const inputArea = document.getElementById('inputArea');
  for (let i = 5; i >= 0; i--) {
    const row = document.createElement('div');
    row.className = 'input-row';
    const label = document.createElement('label');
    label.textContent = LINE_NAMES[i];
    const select = document.createElement('select');
    select.dataset.index = i;
    OPTIONS.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
    select.value = '7';
    row.appendChild(label);
    row.appendChild(select);
    inputArea.appendChild(row);
  }

  function getLineValue(val) { return (val === '7' || val === '9') ? 1 : 0; }
  function isMoving(val) { return val === '6' || val === '9'; }

  function getSixLinesInput() {
    const selects = document.querySelectorAll('#inputArea select');
    const sixLines = [];
    const movingLineIndexes = [];
    selects.forEach(sel => {
      const i = parseInt(sel.dataset.index);
      const val = sel.value;
      sixLines[i] = getLineValue(val);
      if (isMoving(val)) movingLineIndexes.push(i);
    });
    return { sixLines, movingLineIndexes };
  }

  function renderSixLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 5; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function renderTrigramLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 2; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function updateLive() {
    const { sixLines, movingLineIndexes } = getSixLinesInput();
    renderSixLines(sixLines, document.getElementById('benLines'));
    document.getElementById('benName').textContent = getHexNameFromSixLines(sixLines);
    const chgLines = [...sixLines];
    movingLineIndexes.forEach(i => { chgLines[i] = chgLines[i] === 1 ? 0 : 1; });
    renderSixLines(chgLines, document.getElementById('chgLines'));
    document.getElementById('chgName').textContent = getHexNameFromSixLines(chgLines);
    document.getElementById('nineGridSection').style.display = 'none';
    document.getElementById('chainSection').style.display = 'none';
  }

  document.querySelectorAll('#inputArea select').forEach(sel => {
    sel.addEventListener('change', updateLive);
  });

  updateLive();

  // ========== 起卦 ==========
  const castBtn = document.getElementById('castBtn');
  const errorMsg = document.getElementById('errorMsg');
  const nineGridSection = document.getElementById('nineGridSection');
  const baguaWrap = document.getElementById('baguaWrap');
  const chainSection = document.getElementById('chainSection');
  const chainList = document.getElementById('chainList');

  let currentPalaces = null;

  castBtn.addEventListener('click', async () => {
    errorMsg.textContent = '';
    const { sixLines, movingLineIndexes } = getSixLinesInput();
    castBtn.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'cast', sixLines, movingLineIndexes })
      });
      const data = await res.json();
      if (data.error) { errorMsg.textContent = data.error; castBtn.disabled = false; return; }
      currentPalaces = data.palaces;
      renderBagua(data.palaces);
      nineGridSection.style.display = 'block';
      chainSection.style.display = 'none';
      chainList.innerHTML = '';
    } catch (e) {
      errorMsg.textContent = '連線失敗：' + e.message;
    }
    castBtn.disabled = false;
  });

  function renderBagua(palaces) {
    baguaWrap.innerHTML = '';
    ZHI_LAYOUT.forEach(item => {
      const div = document.createElement('div');
      div.className = 'zhi';
      div.dataset.zhi = item.zhi;
      div.textContent = item.zhi;
      div.style.gridRow = item.row;
      div.style.gridColumn = item.col;
      baguaWrap.appendChild(div);
    });
    PALACE_LAYOUT.forEach(item => {
      const div = document.createElement('div');
      div.className = 'palace';
      div.dataset.palace = item.name;
      div.style.gridRow = item.row;
      div.style.gridColumn = item.col;
      if (item.name === '中') { div.classList.add('empty'); baguaWrap.appendChild(div); return; }
      const p = palaces[item.name];
      if (!p) { div.classList.add('empty'); baguaWrap.appendChild(div); return; }
      const linesDiv = document.createElement('div');
      linesDiv.className = 'palace-lines';
      renderTrigramLines(p.lines, linesDiv);
      div.appendChild(linesDiv);
      div.addEventListener('click', () => {
        document.querySelectorAll('.palace.selected').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        runFlyingChain(item.name);
      });
      baguaWrap.appendChild(div);
    });
    updateXunKongDisplay();
  }

  function updateXunKongDisplay() {
    document.querySelectorAll('.zhi').forEach(el => el.classList.remove('xunkong'));
    if (!currentXunKong || currentXunKong.length === 0) return;
    currentXunKong.forEach(zhi => {
      const el = document.querySelector(`.zhi[data-zhi="${zhi}"]`);
      if (el) el.classList.add('xunkong');
    });
  }

  function markPalaceNumber(palaceName, number) {
    const el = document.querySelector(`.palace[data-palace="${palaceName}"]`);
    if (!el) return;
    const old = el.querySelector('.palace-number');
    if (old) old.remove();
    if (number >= 1 && number <= 8) {
      const numDiv = document.createElement('div');
      numDiv.className = 'palace-number';
      numDiv.textContent = CIRCLED_NUM[number];
      el.appendChild(numDiv);
    }
  }

  function clearPalaceNumbers() {
    document.querySelectorAll('.palace-number').forEach(el => el.remove());
  }

  async function runFlyingChain(startPalace) {
    if (!currentPalaces) return;
    clearPalaceNumbers();
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'fly', palaces: currentPalaces, startPalace })
      });
      const data = await res.json();
      if (data.error) { errorMsg.textContent = data.error; return; }
      chainList.innerHTML = '';
      data.chain.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'chain-item';
        const formattedPoem = item.poem && item.poem.trim() ? formatPoem(item.poem) : '（卦詩待補）';
        const poemClass = item.poem && item.poem.trim() ? '' : 'empty';
        div.innerHTML = `<div class="chain-item-name">${item.name}</div><div class="chain-item-poem ${poemClass}">${formattedPoem}</div>`;
        chainList.appendChild(div);
        markPalaceNumber(item.palace, idx + 1);
      });
      chainSection.style.display = 'block';
    } catch (e) {
      errorMsg.textContent = '飛宮鏈失敗：' + e.message;
    }
  }

  // ========== 初始化 ==========
  updateInfo();
</script>
</body>
</html>
