<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>飛宮易卦</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <h1>飛宮易卦</h1>

  <div class="info-panel" id="infoPanel">
    <div class="info-summary" id="infoSummary">
      <div class="info-summary-text" id="infoSummaryText">載入中…</div>
      <div class="info-summary-arrow">▼</div>
    </div>
    <div class="info-body">
      <div class="info-row">
        <label>日期</label>
        <input type="date" id="dateInput">
      </div>
      <div class="info-row">
        <label>時間</label>
        <input type="time" id="timeInput">
      </div>
      <div class="info-row">
        <label>城市</label>
        <input type="text" id="cityInput" value="香港" placeholder="輸入城市名">
      </div>
      <div class="info-readout" id="infoReadout"></div>
      <div class="info-dun" id="infoDun"></div>
      <div class="nominatim-attr">地理位置數據 © OpenStreetMap contributors</div>
    </div>
  </div>

  <div class="question-row">
    <input type="text" id="questionInput" placeholder="今次問甚麼">
  </div>

  <div class="top-section">
    <div class="input-area" id="inputArea"></div>

    <div class="hex-result">
      <div class="hex-box">
        <div class="hex-box-title">本卦</div>
        <div class="hex-box-lines" id="benLines"></div>
        <div class="hex-box-name" id="benName">—</div>
      </div>
      <div class="hex-box">
        <div class="hex-box-title">變卦</div>
        <div class="hex-box-lines" id="chgLines"></div>
        <div class="hex-box-name" id="chgName">—</div>
      </div>
    </div>
  </div>

  <button class="btn" id="castBtn">起 卦</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="chain-section" id="sixiangSection">
    <div class="chain-title">四 象 八 情</div>
    <div class="chain-item">
      <div class="sixiang-text" id="sixiangText"></div>
    </div>
  </div>

  <div class="nine-grid-section" id="nineGridSection">
    <div class="bagua-wrap" id="baguaWrap"></div>
  </div>

  <div class="chain-section" id="chainSection">
    <div class="chain-title">正 推</div>
    <div id="chainList"></div>
  </div>

  <div class="chain-section" id="pangtongSection">
    <div class="chain-title">旁 通</div>
    <div id="pangtongList"></div>
  </div>

  <div class="chain-section" id="chuleiSection">
    <div class="chain-title">觸 類</div>
    <div id="chuleiList"></div>
  </div>

  <div class="footer-actions" id="footerActions">
    <button class="btn-screenshot" id="screenshotBtn">📷 生 成 長 圖</button>
    <div style="margin-top:0.6rem;">
      <button class="btn-screenshot" id="saveHistoryBtn" type="button">存入紀錄</button>
    </div>
    <div class="save-history-msg" id="saveHistoryMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>

<script>
  const API_URL = 'https://feigong-yigua.davchan-clp.workers.dev';

  const LINE_NAMES = ['初', '二', '三', '四', '五', '上'];
  const OPTIONS = ['6', '7', '8', '9'];
  const CIRCLED_NUM = ['', '①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];
  const CIRCLED_ALPHA = ['', 'Ⓐ', 'Ⓑ', 'Ⓒ', 'Ⓓ', 'Ⓔ', 'Ⓕ', 'Ⓖ', 'Ⓗ'];

  const ZHI_LAYOUT = [
    { zhi: '巳', row: 1, col: 2 },
    { zhi: '午', row: 1, col: 3 },
    { zhi: '未', row: 1, col: 4 },
    { zhi: '辰', row: 2, col: 1 },
    { zhi: '申', row: 2, col: 5 },
    { zhi: '卯', row: 3, col: 1 },
    { zhi: '酉', row: 3, col: 5 },
    { zhi: '寅', row: 4, col: 1 },
    { zhi: '戌', row: 4, col: 5 },
    { zhi: '丑', row: 5, col: 2 },
    { zhi: '子', row: 5, col: 3 },
    { zhi: '亥', row: 5, col: 4 }
  ];

  const PALACE_LAYOUT = [
    { name: '巽', row: 2, col: 2 },
    { name: '離', row: 2, col: 3 },
    { name: '坤', row: 2, col: 4 },
    { name: '震', row: 3, col: 2 },
    { name: '中', row: 3, col: 3 },
    { name: '兌', row: 3, col: 4 },
    { name: '艮', row: 4, col: 2 },
    { name: '坎', row: 4, col: 3 },
    { name: '乾', row: 4, col: 4 }
  ];

  const TRIGRAMS = {
    1: { name: '乾', lines: [1,1,1] },
    2: { name: '兌', lines: [1,1,0] },
    3: { name: '離', lines: [1,0,1] },
    4: { name: '震', lines: [1,0,0] },
    5: { name: '巽', lines: [0,1,1] },
    6: { name: '坎', lines: [0,1,0] },
    7: { name: '艮', lines: [0,0,1] },
    8: { name: '坤', lines: [0,0,0] }
  };

  const HEXAGRAM_NAMES = {
    '1_1':'乾為天','1_5':'天風姤','1_7':'天山遯','1_8':'天地否',
    '5_8':'風地觀','7_8':'山地剝','3_8':'火地晉','3_1':'火天大有',
    '2_2':'兌為澤','2_6':'澤水困','2_8':'澤地萃','2_7':'澤山咸',
    '6_7':'水山蹇','8_7':'地山謙','4_7':'雷山小過','4_2':'雷澤歸妹',
    '3_3':'離為火','3_7':'火山旅','3_5':'火風鼎','3_6':'火水未濟',
    '7_6':'山水蒙','5_6':'風水渙','1_6':'天水訟','1_3':'天火同人',
    '4_4':'震為雷','4_8':'雷地豫','4_6':'雷水解','4_5':'雷風恆',
    '8_5':'地風升','6_5':'水風井','2_5':'澤風大過','2_4':'澤雷隨',
    '5_5':'巽為風','5_1':'風天小畜','5_3':'風火家人','5_4':'風雷益',
    '1_4':'天雷無妄','3_4':'火雷噬嗑','7_4':'山雷頤','7_5':'山風蠱',
    '6_6':'坎為水','6_2':'水澤節','6_4':'水雷屯','6_3':'水火既濟',
    '2_3':'澤火革','4_3':'雷火豐','8_3':'地火明夷','8_6':'地水師',
    '7_7':'艮為山','7_3':'山火賁','7_1':'山天大畜','7_2':'山澤損',
    '3_2':'火澤睽','1_2':'天澤履','5_2':'風澤中孚','5_7':'風山漸',
    '8_8':'坤為地','8_4':'地雷復','8_2':'地澤臨','8_1':'地天泰',
    '4_1':'雷天大壯','2_1':'澤天夬','6_1':'水天需','6_8':'水地比'
  };

  function linesToTrigramNum(lines) {
    for (let i = 1; i <= 8; i++) {
      const t = TRIGRAMS[i].lines;
      if (t[0] === lines[0] && t[1] === lines[1] && t[2] === lines[2]) return i;
    }
    return 1;
  }

  function getHexNameFromSixLines(sixLines) {
    const lower = [sixLines[0], sixLines[1], sixLines[2]];
    const upper = [sixLines[3], sixLines[4], sixLines[5]];
    const upperNum = linesToTrigramNum(upper);
    const lowerNum = linesToTrigramNum(lower);
    return HEXAGRAM_NAMES[`${upperNum}_${lowerNum}`] || '—';
  }

  function formatPoem(poem) {
    if (!poem || !poem.trim()) return '';
    const lines = poem.split('\n').filter(l => l.trim());
    const merged = [];
    for (let i = 0; i < lines.length; i += 2) {
      if (i + 1 < lines.length) {
        merged.push(lines[i].trim() + '　' + lines[i+1].trim());
      } else {
        merged.push(lines[i].trim());
      }
    }
    return merged.join('\n');
  }

  const TIAN_GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const DI_ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

  function getDayGanZhi(date) {
    const base = new Date(Date.UTC(1900, 0, 1));
    const target = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const diffDays = Math.round((target - base) / 86400000);
    const ganIdx = ((0 + diffDays) % 10 + 10) % 10;
    const zhiIdx = ((10 + diffDays) % 12 + 12) % 12;
    return { gan: TIAN_GAN[ganIdx], zhi: DI_ZHI[zhiIdx], ganIdx, zhiIdx };
  }

  function getXunKong(dayGanZhi) {
    const ganIdx = dayGanZhi.ganIdx;
    const zhiIdx = dayGanZhi.zhiIdx;
    const xunShouZhi = ((zhiIdx - ganIdx) % 12 + 12) % 12;
    const xunKongMap = {
      0: ['戌','亥'], 10: ['申','酉'], 8: ['午','未'],
      6: ['辰','巳'], 4: ['寅','卯'], 2: ['子','丑']
    };
    return xunKongMap[xunShouZhi] || [];
  }

  function equationOfTime(date) {
    const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    const B = (360 / 365) * (dayOfYear - 81) * Math.PI / 180;
    return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  }

  function calcTrueSolarTime(date, lon) {
    const lonCorrection = (lon - 120) * 4;
    const eot = equationOfTime(date);
    const totalCorrectionMin = lonCorrection + eot;
    const result = new Date(date.getTime() + totalCorrectionMin * 60000);
    return { time: result, correctionMin: totalCorrectionMin, lonCorrection, eot };
  }

  const GEO_CACHE_KEY = 'feigong_geo_cache_v1';
  function loadGeoCache() {
    try { return JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveGeoCache(cache) {
    try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
  }

  async function queryCityLon(cityName) {
    const cache = loadGeoCache();
    const key = cityName.trim().toLowerCase();
    if (cache[key]) return cache[key];
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(cityName);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('地理查詢失敗');
    const data = await res.json();
    if (!data || data.length === 0) throw new Error('找不到該城市');
    const result = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), displayName: data[0].display_name };
    cache[key] = result;
    saveGeoCache(cache);
    return result;
  }

  function jieQiJD(year, type) {
    const Y = (year - 2000) / 1000;
    const terms = {
      summer: [
        2451716.56767, 365241.62603, 0.00325, 0.00888, -0.00030,
        -0.00030, 0.00007, -0.00002, -0.00002, 0.00001
      ],
      winter: [
        2451900.05952, 365242.74049, -0.06223, -0.00823, 0.00032,
        0.00025, -0.00007, 0.00003, 0.00001, -0.00001
      ]
    };
    const t = type === 1 ? terms.summer : terms.winter;
    const JDE0 = t[0] + t[1] * Y + (t[2] + t[3] * Y) * Y * Y
      + (t[4] + t[5] * Y) * Y * Y * Y
      + (t[6] + t[7] * Y) * Y * Y * Y * Y
      + (t[8] + t[9] * Y) * Y * Y * Y * Y * Y;
    const deltaT = 69;
    return JDE0 - deltaT / 86400;
  }

  function jdToDate(jd) {
    const unixMs = (jd - 2440587.5) * 86400000;
    return new Date(unixMs);
  }

  function getSummerSolstice(year) { return jdToDate(jieQiJD(year, 1)); }
  function getWinterSolstice(year) { return jdToDate(jieQiJD(year, 3)); }

  function getDunType(date) {
    const year = date.getFullYear();
    const events = [];
    for (const y of [year - 1, year, year + 1]) {
      events.push({ name: '夏至', time: getSummerSolstice(y) });
      events.push({ name: '冬至', time: getWinterSolstice(y) });
    }
    events.sort((a, b) => a.time - b.time);
    const t = date.getTime();
    let lastEvent = null;
    for (const ev of events) {
      if (ev.time.getTime() <= t) lastEvent = ev;
      else break;
    }
    if (!lastEvent) return 'yang';
    return lastEvent.name === '冬至' ? 'yang' : 'yin';
  }

  const infoPanel = document.getElementById('infoPanel');
  const infoSummary = document.getElementById('infoSummary');
  const infoSummaryText = document.getElementById('infoSummaryText');
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const cityInput = document.getElementById('cityInput');
  const infoReadout = document.getElementById('infoReadout');
  const infoDun = document.getElementById('infoDun');

  let currentLon = 114.17;
  let currentLat = 22.32;
  let currentXunKong = [];
  let lastTrueSolarTime = '';
  let lastDun = '';
  let lastYongshen = '';
  let lastZhengtui = null;
  let lastPangtong = null;
  let lastChulei = null;

  function clearChainMemory() {
    lastYongshen = '';
    lastZhengtui = null;
    lastPangtong = null;
    lastChulei = null;
  }

  infoSummary.addEventListener('click', () => {
    infoPanel.classList.toggle('expanded');
  });

  function initDateTime() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    dateInput.value = `${y}-${m}-${d}`;
    timeInput.value = `${hh}:${mm}`;
  }
  initDateTime();

  function getShiChen(hour) {
    const zhiNames = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const idx = Math.floor(((hour + 1) % 24) / 2);
    return zhiNames[idx];
  }

  function getShiChenNum(zhi) {
    const map = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 };
    return map[zhi] || 1;
  }

  async function updateInfo() {
    try {
      const cityName = cityInput.value.trim() || '香港';
      let geo;
      if (cityName === '香港' || cityName === 'Hong Kong') {
        geo = { lat: 22.32, lon: 114.17, displayName: '香港' };
      } else {
        geo = await queryCityLon(cityName);
      }
      currentLon = geo.lon;
      currentLat = geo.lat;

      const [y, mo, d] = dateInput.value.split('-').map(Number);
      const [hh, mm] = timeInput.value.split(':').map(Number);
      const stdTime = new Date(y, mo - 1, d, hh, mm, 0);

      const tst = calcTrueSolarTime(stdTime, currentLon);
      const tstHH = String(tst.time.getHours()).padStart(2, '0');
      const tstMM = String(tst.time.getMinutes()).padStart(2, '0');

      // 夜子時（23:00–23:59）：換日
      // 時辰仍用真太陽時（23 → 子時），但日柱、農曆用次日
      let effectiveDate = new Date(tst.time);
      if (tst.time.getHours() === 23) {
        effectiveDate = new Date(tst.time.getTime() + 3600000);
      }

      const shiChen = getShiChen(tst.time.getHours());
      const shiChenNum = getShiChenNum(shiChen);

      const dayGZ = getDayGanZhi(effectiveDate);
      currentXunKong = getXunKong(dayGZ);

      const lunar = Lunar.fromDate(effectiveDate);
      const lunarMonthNum = Math.abs(lunar.getMonth());
      const lunarDayNum = lunar.getDay();

      const yearGanZhi = lunar.getYearInGanZhiByLiChun();
      const yearZhi = yearGanZhi.charAt(1);
      const yearZhiNum = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 }[yearZhi];

      const sum = yearZhiNum + lunarMonthNum + lunarDayNum + shiChenNum;
      let remainder = sum % 9;
      if (remainder === 0) remainder = 9;

      const dunType = getDunType(tst.time);
      const dunLabel = (dunType === 'yang' ? '陽遁' : '陰遁') + remainder + '局';
      lastTrueSolarTime = `${tstHH}:${tstMM}`;
      lastDun = dunLabel;

      const corrStr = (tst.correctionMin >= 0 ? '+' : '') + tst.correctionMin.toFixed(1) + '分';
      infoReadout.innerHTML =
        `${yearGanZhi}年${lunarMonthNum}月${lunarDayNum}日${shiChen}時<br>` +
        `真太陽時：<span class="highlight">${tstHH}:${tstMM}</span>　校正：${corrStr}`;
      infoDun.textContent = dunLabel;

      infoSummaryText.textContent = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · ${cityName} · ${dunLabel}`;

      updateXunKongDisplay();
    } catch (e) {
      infoReadout.textContent = '（' + e.message + '）';
    }
  }

  dateInput.addEventListener('change', updateInfo);
  timeInput.addEventListener('change', updateInfo);
  cityInput.addEventListener('change', updateInfo);

  const inputArea = document.getElementById('inputArea');
  for (let i = 5; i >= 0; i--) {
    const row = document.createElement('div');
    row.className = 'input-row';
    const label = document.createElement('label');
    label.textContent = LINE_NAMES[i];
    const select = document.createElement('select');
    select.dataset.index = i;
    OPTIONS.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
    select.value = '7';
    row.appendChild(label);
    row.appendChild(select);
    inputArea.appendChild(row);
  }

  function getLineValue(val) {
    return (val === '7' || val === '9') ? 1 : 0;
  }
  function isMoving(val) {
    return val === '6' || val === '9';
  }

  function getSixLinesInput() {
    const selects = document.querySelectorAll('#inputArea select');
    const sixLines = [];
    const movingLineIndexes = [];
    selects.forEach(sel => {
      const i = parseInt(sel.dataset.index);
      const val = sel.value;
      sixLines[i] = getLineValue(val);
      if (isMoving(val)) movingLineIndexes.push(i);
    });
    return { sixLines, movingLineIndexes };
  }

  function getRawSixLines() {
    const raw = [];
    document.querySelectorAll('#inputArea select').forEach(sel => {
      raw[parseInt(sel.dataset.index)] = sel.value;
    });
    return raw;
  }

  function renderSixLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 5; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function renderTrigramLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 2; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function updateLive() {
    const { sixLines, movingLineIndexes } = getSixLinesInput();

    renderSixLines(sixLines, document.getElementById('benLines'));
    document.getElementById('benName').textContent = getHexNameFromSixLines(sixLines);

    const chgLines = [...sixLines];
    movingLineIndexes.forEach(i => { chgLines[i] = chgLines[i] === 1 ? 0 : 1; });
    renderSixLines(chgLines, document.getElementById('chgLines'));
    document.getElementById('chgName').textContent = getHexNameFromSixLines(chgLines);

    document.getElementById('sixiangSection').style.display = 'none';
    document.getElementById('nineGridSection').style.display = 'none';
    document.getElementById('chainSection').style.display = 'none';
    document.getElementById('pangtongSection').style.display = 'none';
    document.getElementById('chuleiSection').style.display = 'none';
    clearChainMemory();
  }

  document.querySelectorAll('#inputArea select').forEach(sel => {
    sel.addEventListener('change', updateLive);
  });

  updateLive();

  const castBtn = document.getElementById('castBtn');
  const errorMsg = document.getElementById('errorMsg');
  const sixiangSection = document.getElementById('sixiangSection');
  const sixiangText = document.getElementById('sixiangText');
  const nineGridSection = document.getElementById('nineGridSection');
  const baguaWrap = document.getElementById('baguaWrap');
  const chainSection = document.getElementById('chainSection');
  const chainList = document.getElementById('chainList');
  const pangtongSection = document.getElementById('pangtongSection');
  const pangtongList = document.getElementById('pangtongList');
  const chuleiSection = document.getElementById('chuleiSection');
  const chuleiList = document.getElementById('chuleiList');

  let currentPalaces = null;

  castBtn.addEventListener('click', async () => {
    errorMsg.textContent = '';
    const { sixLines, movingLineIndexes } = getSixLinesInput();

    castBtn.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'cast',
          sixLines: sixLines,
          movingLineIndexes: movingLineIndexes
        })
      });
      const data = await res.json();
      if (data.error) {
        errorMsg.textContent = data.error;
        castBtn.disabled = false;
        return;
      }

      if (data.sixiang) {
        sixiangText.textContent = data.sixiang.text;
        sixiangSection.style.display = 'block';
      } else {
        sixiangSection.style.display = 'none';
      }

      currentPalaces = data.palaces;
      renderBagua(data.palaces);
      nineGridSection.style.display = 'block';

      chainSection.style.display = 'none';
      chainList.innerHTML = '';
      pangtongSection.style.display = 'none';
      pangtongList.innerHTML = '';
      chuleiSection.style.display = 'none';
      chuleiList.innerHTML = '';
      clearChainMemory();
    } catch (e) {
      errorMsg.textContent = '連線失敗：' + e.message;
    }
    castBtn.disabled = false;
  });

  function renderBagua(palaces) {
    baguaWrap.innerHTML = '';

    ZHI_LAYOUT.forEach(item => {
      const div = document.createElement('div');
      div.className = 'zhi';
      div.dataset.zhi = item.zhi;
      div.textContent = item.zhi;
      div.style.gridRow = item.row;
      div.style.gridColumn = item.col;
      baguaWrap.appendChild(div);
    });

    PALACE_LAYOUT.forEach(item => {
      const div = document.createElement('div');
      div.className = 'palace';
      div.dataset.palace = item.name;
      div.style.gridRow = item.row;
      div.style.gridColumn = item.col;

      if (item.name === '中') {
        div.classList.add('empty');
        baguaWrap.appendChild(div);
        return;
      }

      const p = palaces[item.name];
      if (!p) {
        div.classList.add('empty');
        baguaWrap.appendChild(div);
        return;
      }

      const linesDiv = document.createElement('div');
      linesDiv.className = 'palace-lines';
      renderTrigramLines(p.lines, linesDiv);
      div.appendChild(linesDiv);

      div.addEventListener('click', () => {
        document.querySelectorAll('.palace.selected').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        runFlyingChain(item.name);
      });

      baguaWrap.appendChild(div);
    });

    updateXunKongDisplay();
  }

  function updateXunKongDisplay() {
    document.querySelectorAll('.zhi').forEach(el => {
      el.classList.remove('xunkong');
    });
    if (!currentXunKong || currentXunKong.length === 0) return;
    currentXunKong.forEach(zhi => {
      const el = document.querySelector(`.zhi[data-zhi="${zhi}"]`);
      if (el) el.classList.add('xunkong');
    });
  }

  function markPalaceNumber(palaceName, number) {
    const el = document.querySelector(`.palace[data-palace="${palaceName}"]`);
    if (!el) return;
    const old = el.querySelector('.palace-number');
    if (old) old.remove();
    if (number >= 1 && number <= 8) {
      const numDiv = document.createElement('div');
      numDiv.className = 'palace-number';
      numDiv.textContent = CIRCLED_NUM[number];
      el.appendChild(numDiv);
    }
  }

  function clearPalaceNumbers() {
    document.querySelectorAll('.palace-number').forEach(el => el.remove());
  }

  function markPalaceLetter(palaceName, index) {
    const el = document.querySelector(`.palace[data-palace="${palaceName}"]`);
    if (!el) return;
    const old = el.querySelector('.palace-letter');
    if (old) old.remove();
    if (index >= 1 && index < CIRCLED_ALPHA.length) {
      const letterDiv = document.createElement('div');
      letterDiv.className = 'palace-letter';
      letterDiv.textContent = CIRCLED_ALPHA[index];
      el.appendChild(letterDiv);
    }
  }

  function clearPalaceLetters() {
    document.querySelectorAll('.palace-letter').forEach(el => el.remove());
  }

  function markPalaceAsterisk(palaceName) {
    const el = document.querySelector(`.palace[data-palace="${palaceName}"]`);
    if (!el) return;
    const old = el.querySelector('.palace-asterisk');
    if (old) old.remove();
    const astDiv = document.createElement('div');
    astDiv.className = 'palace-asterisk';
    astDiv.textContent = '*';
    el.appendChild(astDiv);
  }

  function clearPalaceAsterisks() {
    document.querySelectorAll('.palace-asterisk').forEach(el => el.remove());
  }

  async function runChain(startPalace, mode) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'fly',
        palaces: currentPalaces,
        startPalace: startPalace,
        mode: mode
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  function makeChainItemHTML(item) {
    const formattedPoem = item.poem && item.poem.trim() ? formatPoem(item.poem) : '（卦詩待補）';
    const poemClass = item.poem && item.poem.trim() ? '' : 'empty';
    const fanyinMark = item.fanyin ? ' 【反吟】' : '';
    return `
      <div class="chain-item-name">${item.name}${fanyinMark}</div>
      <div class="chain-item-poem ${poemClass}">${formattedPoem}</div>
    `;
  }

  async function runFlyingChain(startPalace) {
    if (!currentPalaces) return;
    clearChainMemory();
    clearPalaceNumbers();
    clearPalaceLetters();
    clearPalaceAsterisks();

    try {
      const zhengtuiData = await runChain(startPalace, 'zhengtui');
      chainList.innerHTML = '';
      zhengtuiData.chain.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'chain-item';
        div.innerHTML = makeChainItemHTML(item);
        chainList.appendChild(div);
        markPalaceNumber(item.palace, idx + 1);
      });
      chainSection.style.display = 'block';

      const pangtongData = await runChain(startPalace, 'pangtong');
      pangtongList.innerHTML = '';
      pangtongData.chain.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'chain-item';
        div.innerHTML = makeChainItemHTML(item);
        pangtongList.appendChild(div);
        markPalaceLetter(item.palace, idx + 1);
      });
      pangtongSection.style.display = 'block';

      chuleiList.innerHTML = '';
      const chulei = pangtongData.chulei;
      if (chulei && chulei.found && chulei.items.length > 0) {
        chulei.items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'chain-item';
          div.innerHTML = makeChainItemHTML(item);
          chuleiList.appendChild(div);
          markPalaceAsterisk(item.palace);
        });
      } else {
        const div = document.createElement('div');
        div.className = 'chain-item';
        div.innerHTML = '<div class="chain-item-name" style="color:#8a8578;">無處觸類</div>';
        chuleiList.appendChild(div);
      }
      chuleiSection.style.display = 'block';

      lastYongshen = startPalace;
      lastZhengtui = zhengtuiData.chain;
      lastPangtong = pangtongData.chain;
      lastChulei = pangtongData.chulei || { found: false, items: [] };
    } catch (e) {
      errorMsg.textContent = '飛宮鏈失敗：' + e.message;
    }
  }

  updateInfo();

  const saveHistoryBtn = document.getElementById('saveHistoryBtn');
  const saveHistoryMsg = document.getElementById('saveHistoryMsg');
  if (saveHistoryBtn) {
    saveHistoryBtn.addEventListener('click', async () => {
      if (saveHistoryMsg) saveHistoryMsg.textContent = '';
      if (!currentPalaces) {
        if (saveHistoryMsg) saveHistoryMsg.textContent = '請先起卦';
        return;
      }
      if (!lastYongshen || !lastZhengtui || !lastPangtong) {
        if (saveHistoryMsg) saveHistoryMsg.textContent = '請先點選用神宮';
        return;
      }

      saveHistoryBtn.disabled = true;
      saveHistoryBtn.textContent = '儲存中…';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'saveHistory',
            data: {
              問事: document.getElementById('questionInput').value.trim(),
              六爻: getRawSixLines(),
              本卦: document.getElementById('benName').textContent,
              變卦: document.getElementById('chgName').textContent,
              用神宮: lastYongshen,
              正推: lastZhengtui,
              旁通: lastPangtong,
              觸類: lastChulei || { found: false, items: [] },
              日期: dateInput.value,
              時間: timeInput.value,
              城市: cityInput.value.trim(),
              真太陽時: lastTrueSolarTime,
              遁局: lastDun
            }
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          if (saveHistoryMsg) saveHistoryMsg.textContent = data.error || '儲存失敗';
        } else {
          if (saveHistoryMsg) saveHistoryMsg.textContent = '已存入紀錄';
        }
      } catch (e) {
        if (saveHistoryMsg) saveHistoryMsg.textContent = '連線失敗：' + e.message;
      }
      saveHistoryBtn.disabled = false;
      saveHistoryBtn.textContent = '存入紀錄';
    });
  }

  const screenshotBtn = document.getElementById('screenshotBtn');
  if (screenshotBtn) {
    screenshotBtn.addEventListener('click', async () => {
      screenshotBtn.disabled = true;
      screenshotBtn.textContent = '生成中…';

      const footerActions = document.getElementById('footerActions');
      footerActions.style.display = 'none';

      try {
        const app = document.querySelector('.app');
        const canvas = await html2canvas(app, {
          scale: 2,
          backgroundColor: '#faf8f3',
          useCORS: true,
          logging: false
        });

        const dataUrl = canvas.toDataURL('image/png');

        footerActions.style.display = '';
        screenshotBtn.disabled = false;
        screenshotBtn.textContent = '📷 生 成 長 圖';

        showScreenshotPreview(dataUrl);
      } catch (e) {
        footerActions.style.display = '';
        alert('生成失敗：' + e.message);
        screenshotBtn.disabled = false;
        screenshotBtn.textContent = '📷 生 成 長 圖';
      }
    });
  }

  function showScreenshotPreview(dataUrl) {
    const old = document.getElementById('screenshotPreview');
    if (old) old.remove();

    const overlay = document.createElement('div');
    overlay.id = 'screenshotPreview';
    overlay.className = 'screenshot-preview';

    const closeBtn = document.createElement('button');
    closeBtn.className = 'screenshot-close';
    closeBtn.textContent = '✕ 關閉';
    closeBtn.addEventListener('click', () => overlay.remove());

    const hint = document.createElement('div');
    hint.className = 'screenshot-hint';
    hint.textContent = '長按圖片 → 存儲到照片';

    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = '飛宮易卦長圖';

    overlay.appendChild(closeBtn);
    overlay.appendChild(hint);
    overlay.appendChild(img);
    document.body.appendChild(overlay);
  }
</script>
</body>
</html>
