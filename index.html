<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#faf8f3" id="themeColor">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('feigong-theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="飛宮易卦">
  <title>飛宮易卦</title>
  <link rel="icon" href="icon.png" type="image/png" sizes="1024x1024">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="app">

  <div id="viewCast">
  <div class="info-panel" id="infoPanel">
    <div class="info-summary" id="infoSummary">

    <div class="info-body">
      <div class="info-row">

      </div>
      <div class="info-row">
        <label>時間</label>
        <div class="datetime-field">

        </div>
      </div>
      <div class="info-row">
        <label>城市</label>

  <div class="question-row">
    <input type="text" id="questionInput" placeholder="今次問甚麼">

  <div class="top-section">
    <div class="input-area" id="inputArea"></div>

    <div class="hex-result">

        <div class="hex-box-title">本卦</div>
        <div class="hex-box-lines" id="benLines" data-chart="ben-lines"></div>
        <div class="hex-box-name" id="benName" data-chart="ben-name">—</div>
      </div>
      <div class="hex-box">
        <div class="hex-box-title">變卦</div>
        <div class="hex-box-lines" id="chgLines" data-chart="chg-lines"></div>
        <div class="hex-box-name" id="chgName" data-chart="chg-name">—</div>
      </div>

  <button class="btn" id="castBtn">起 卦</button>

  <div class="chain-section" id="sixiangSection" data-chart="sixiang">
    <div class="chain-title">四 象 八 情</div>

  </div>

  <div class="chain-section" id="chainSection" data-chart="zhengtui">

  <div class="chain-section" id="pangtongSection" data-chart="pangtong">

  </div>

  <div class="footer-actions" id="footerActions">
    <div class="footer-btn-row">
      <button class="btn-footer" id="screenshotBtn" type="button">📷 生 成 長 圖</button>
      <button class="btn-footer" id="saveHistoryBtn" type="button">📝 存 入 紀 錄</button>

  </div>
  </div>

  <div id="viewCases" class="view-cases" hidden>
    <div class="case-search-wrap">
      <div class="question-row case-search-row">
        <input type="text" id="caseSearchInput" placeholder="搜尋問事關鍵詞" autocomplete="off">

      <div class="case-suggest" id="caseSuggest" hidden></div>

    <div id="caseDetail" class="case-detail" hidden>

      <div id="caseCaptureRoot" class="case-capture-root">
        <div class="case-meta" id="caseMeta"></div>

        <div class="top-section case-hex-section">
          <div class="hex-result case-hex-result">
            <div class="hex-box">
              <div class="hex-box-title">本卦</div>
              <div class="hex-box-lines" id="caseBenLines" data-chart="ben-lines"></div>

          <div class="chain-item">

          </div>

        </div>

        <div class="chain-section" id="caseChainSection" data-chart="zhengtui" style="display:none;">
          <div class="chain-title">正 推</div>
          <div id="caseChainList" data-chart="zhengtui-list"></div>
        </div>

        <div class="chain-section" id="casePangtongSection" data-chart="pangtong" style="display:none;">
          <div class="chain-title">旁 通</div>

        </div>

        <div class="chain-section" id="caseChuleiSection" data-chart="chulei" style="display:none;">

        <div class="chain-section" id="caseQimenSection" data-chart="qimen" style="display:none;">
          <div class="chain-title" id="caseQimenTitle" data-chart="qimen-title">奇 門 局</div>

      <div class="footer-actions case-footer-actions" id="caseFooterActions">

          <button class="btn-footer" id="caseScreenshotBtn" type="button">📷 生 成 長 圖</button>

<div id="caseNoteModal" class="note-modal" hidden>
  <div class="note-modal-backdrop" id="caseNoteBackdrop"></div>

      <button type="button" class="btn-footer" id="caseNoteCancelBtn">取 消</button>
      <button type="button" class="btn-footer note-modal-save" id="caseNoteSaveBtn">儲 存</button>

<div id="qimenModal" class="note-modal" hidden>
  <div class="note-modal-backdrop" id="qimenModalBackdrop"></div>
  <div class="note-modal-panel qimen-modal-panel" role="dialog" aria-labelledby="qimenModalTitle">
    <div class="note-modal-title qimen-modal-title" id="qimenModalTitle"></div>
    <div class="qimen-modal-body" id="qimenModalBody"></div>
    <div class="note-modal-actions">
      <button type="button" class="btn-footer note-modal-save" id="qimenModalCloseBtn">關 閉</button>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>

<script>
  const API_URL = 'https://feigong-yigua.davchan-clp.workers.dev';

  const LINE_NAMES = ['初', '二', '三', '四', '五', '上'];
  const OPTIONS = ['6', '7', '8', '9'];
  const CIRCLED_NUM = ['', '①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];
  const CIRCLED_ALPHA = ['', 'Ⓐ', 'Ⓑ', 'Ⓒ', 'Ⓓ', 'Ⓔ', 'Ⓕ', 'Ⓖ', 'Ⓗ'];

  const ZHI_LAYOUT = [
    { zhi: '巳', row: 1, col: 2 },
    { zhi: '午', row: 1, col: 3 },
    { zhi: '未', row: 1, col: 4 },
    { zhi: '辰', row: 2, col: 1 },
    { zhi: '申', row: 2, col: 5 },
    { zhi: '卯', row: 3, col: 1 },
    { zhi: '酉', row: 3, col: 5 },
    { zhi: '寅', row: 4, col: 1 },
    { zhi: '戌', row: 4, col: 5 },
    { zhi: '丑', row: 5, col: 2 },
    { zhi: '子', row: 5, col: 3 },
    { zhi: '亥', row: 5, col: 4 }
  ];

  const PALACE_LAYOUT = [
    { name: '巽', row: 2, col: 2 },
    { name: '離', row: 2, col: 3 },
    { name: '坤', row: 2, col: 4 },
    { name: '震', row: 3, col: 2 },
    { name: '中', row: 3, col: 3 },
    { name: '兌', row: 3, col: 4 },
    { name: '艮', row: 4, col: 2 },
    { name: '坎', row: 4, col: 3 },
    { name: '乾', row: 4, col: 4 }
  ];

  const TIAN_GAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
  const DI_ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

  // 奇門顯示用（起盤規則在 Worker）
  const PALACE_NUM = {
    坎: 1, 坤: 2, 震: 3, 巽: 4, 中: 5, 乾: 6, 兌: 7, 艮: 8, 離: 9
  };
  const PALACE_NUM_CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const PALACE_NAME_BY_NUM = {
    1: '坎', 2: '坤', 3: '震', 4: '巽', 5: '中', 6: '乾', 7: '兌', 8: '艮', 9: '離'
  };

  function getHourZhiIndex(hour) {
    return Math.floor(((hour + 1) % 24) / 2);
  }

  function getHourGanZhi(dayGanIdx, hour) {
    const zhiIdx = getHourZhiIndex(hour);
    const startGan = [0, 2, 4, 6, 8, 0, 2, 4, 6, 8][dayGanIdx];
    const ganIdx = (startGan + zhiIdx) % 10;
    return {
      gan: TIAN_GAN[ganIdx],
      zhi: DI_ZHI[zhiIdx],
      ganIdx,
      zhiIdx,
      label: TIAN_GAN[ganIdx] + DI_ZHI[zhiIdx]
    };
  }

  function qimenCellByName(pan, name) {
    const cells = pan && pan.cells;
    if (!cells || !name) return null;
    const keys = Object.keys(cells);
    for (let i = 0; i < keys.length; i++) {
      const cell = cells[keys[i]];
      if (cell && cell.name === name) return cell;
    }
    return null;
  }

  // 奇門只在這裡向 Worker 要盤。盤上已有坐方／向方格局就直接用；
  // 舊 Worker 沒有格局欄時，才補一次 qimenGeju（心法表不在頁面）。
  async function qimenReading(dunLabel, hourGZ, marks) {
    if (!dunLabel || !hourGZ) return null;
    const zuofang = (marks && marks.zuofang) || '';
    const xiangfang = (marks && marks.xiangfang) || '';
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'qimen',
        dunLabel,
        hourGZ: {
          gan: hourGZ.gan,
          zhi: hourGZ.zhi,
          ganIdx: hourGZ.ganIdx,
          zhiIdx: hourGZ.zhiIdx,
          label: hourGZ.label
        },
        zuofang,
        xiangfang
      })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || '奇門起盤失敗');
    await fillMissingQimenGeju(data, zuofang, xiangfang);
    return data;
  }

  async function fillMissingQimenGeju(pan, zuofang, xiangfang) {
    const names = [];
    if (zuofang) names.push(zuofang);
    if (xiangfang && xiangfang !== zuofang) names.push(xiangfang);
    if (!names.length || !pan || !pan.cells) return;
    for (let i = 0; i < names.length; i++) {
      const cell = qimenCellByName(pan, names[i]);
      if (!cell || (cell.geju && typeof cell.geju === 'object')) continue;
      if (!cell.tian || !cell.di) {
        cell.geju = { name: '', poem: '', error: '此宮天／地盤干不全' };
        continue;
      }
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'qimenGeju', tian: cell.tian, di: cell.di })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          cell.geju = { name: '', poem: '', error: (data && data.error) || '查詢失敗' };
        } else {
          cell.geju = { name: data.name || '', poem: data.poem || '' };
        }
      } catch (e) {
        cell.geju = { name: '', poem: '', error: '連線失敗：' + e.message };
      }
    }
  }

  function qimenDoorLabel(door) {
    if (!door) return '';
    return door.endsWith('門') ? door : door + '門';
  }

  // 神／星／門／干五行：金橙黃、木綠、水藍、火紅、土啡
  const QIMEN_WUXING = {
    值符: 'tu', 騰蛇: 'huo', 太陰: 'jin', 六合: 'mu',
    白虎: 'jin', 玄武: 'shui', 勾陳: 'tu', 朱雀: 'huo',
    九地: 'tu', 九天: 'jin',
    天蓬: 'shui', 天芮: 'tu', 天沖: 'mu', 天輔: 'mu',
    天心: 'jin', 天柱: 'jin', 天任: 'tu', 天英: 'huo',
    休: 'shui', 生: 'tu', 傷: 'mu', 杜: 'mu',
    景: 'huo', 死: 'tu', 驚: 'jin', 開: 'jin',
    休門: 'shui', 生門: 'tu', 傷門: 'mu', 杜門: 'mu',
    景門: 'huo', 死門: 'tu', 驚門: 'jin', 開門: 'jin',
    甲: 'mu', 乙: 'mu', 丙: 'huo', 丁: 'huo',
    戊: 'tu', 己: 'tu', 庚: 'jin', 辛: 'jin',
    壬: 'shui', 癸: 'shui',
    // 地支五行（四柱著色用）
    子: 'shui', 丑: 'tu', 寅: 'mu', 卯: 'mu',
    辰: 'tu', 巳: 'huo', 午: 'huo', 未: 'tu',
    申: 'jin', 酉: 'jin', 戌: 'tu', 亥: 'shui',
    // 九宮卦名五行（與盤面色一致）
    坎: 'shui', 坤: 'tu', 震: 'mu', 巽: 'mu',
    中: 'tu', 乾: 'jin', 兌: 'jin', 艮: 'tu', 離: 'huo'
  };

  function qimenWuxing(name) {
    if (!name) return '';
    return QIMEN_WUXING[name] || QIMEN_WUXING[name.replace(/門$/, '')] || '';
  }

  function chainLastPalace(chain) {
    if (!Array.isArray(chain) || chain.length === 0) return '';
    const last = chain[chain.length - 1];
    return (last && last.palace) || '';
  }

  function renderQimenStems(tianText, diText) {
    const row = document.createElement('div');
    row.className = 'qimen-stems';
    if (tianText) {
      const tian = document.createElement('span');
      tian.className = 'qimen-tian';
      const tianWx = qimenWuxing(tianText);
      if (tianWx) tian.dataset.wx = tianWx;
      tian.textContent = tianText;
      row.appendChild(tian);
    }
    if (diText) {
      const di = document.createElement('span');
      di.className = 'qimen-di';
      const diWx = qimenWuxing(diText);
      if (diWx) di.dataset.wx = diWx;
      di.textContent = diText;
      row.appendChild(di);
    }
    return row;
  }

  function renderQimenCell(c, marks) {
    const div = document.createElement('div');
    div.className = 'qimen-cell' + (c.empty ? ' qimen-center' : '');
    div.dataset.palace = c.name;
    if (c.tian) div.dataset.tian = c.tian;
    if (c.di) div.dataset.di = c.di;
    if (c.god) div.dataset.god = c.god;
    if (c.star) div.dataset.star = c.star;
    if (c.door) div.dataset.door = c.door;
    let role = '';
    if (marks && marks.zuofang && marks.zuofang === c.name) {
      div.classList.add('qimen-zuofang');
      role = 'zuofang';
    }
    if (marks && marks.xiangfang && marks.xiangfang === c.name) {
      div.classList.add('qimen-xiangfang');
      role = role ? 'both' : 'xiangfang';
    }
    if (role) {
      div.classList.add('qimen-modal-hot');
      div.dataset.qimenRole = role;
      div.title = '連按三下查看奇門';
    }
    if (c.geju && typeof c.geju === 'object') {
      div.dataset.gejuEmbedded = '1';
      if (c.geju.name) div.dataset.gejuName = c.geju.name;
      if (c.geju.poem) div.dataset.gejuPoem = c.geju.poem;
      if (c.geju.error) div.dataset.gejuError = c.geju.error;
    }

    if (c.empty) {
      if (c.di) div.appendChild(renderQimenStems('', c.di));
      return div;
    }

    const god = document.createElement('div');
    god.className = 'qimen-god';
    const godWx = qimenWuxing(c.god);
    if (godWx) god.dataset.wx = godWx;
    god.textContent = c.god || '';
    div.appendChild(god);

    const star = document.createElement('div');
    star.className = 'qimen-star';
    const starWx = qimenWuxing(c.star);
    if (starWx) star.dataset.wx = starWx;
    star.textContent = c.star || '';
    div.appendChild(star);

    const door = document.createElement('div');
    door.className = 'qimen-door';
    const doorWx = qimenWuxing(c.door);
    if (doorWx) door.dataset.wx = doorWx;
    door.textContent = qimenDoorLabel(c.door);
    div.appendChild(door);

    div.appendChild(renderQimenStems(c.tian, c.di));
    return div;
  }

  async function renderQimenBoard(dunLabel, hourGZ, wrapEl, titleEl, xunKongList, marks, siZhu) {
    if (!wrapEl) return false;
    wrapEl.innerHTML = '';
    if (titleEl) titleEl.textContent = '奇 門 局';
    if (!dunLabel) return false;
    if (!hourGZ) {
      const err = document.createElement('div');
      err.className = 'qimen-meta';
      err.textContent = '奇門起盤失敗：無法解析時柱';
      wrapEl.appendChild(err);
      return true;
    }

    let pan;
    try {
      pan = await qimenReading(dunLabel, hourGZ, marks || {});
    } catch (e) {
      const err = document.createElement('div');
      err.className = 'qimen-meta';
      err.textContent = '奇門起盤失敗：' + e.message;
      wrapEl.appendChild(err);
      return true;
    }
    if (!pan || !pan.cells || !pan.meta) return false;

    const fuGong = PALACE_NAME_BY_NUM[pan.meta.fuLinPalace] || '';
    const shiGong = PALACE_NAME_BY_NUM[pan.meta.doorLinPalace] || '';
    const shiGongNum = PALACE_NUM_CN[pan.meta.doorLinPalace] || '';
    const fuGongNum = PALACE_NUM_CN[pan.meta.fuLinPalace] || '';
    const meta = document.createElement('div');
    meta.className = 'qimen-meta';
    meta.appendChild(document.createTextNode(`${pan.meta.dunLabel} · 時家轉盤·置閏 · 四柱`));
    const hasSiZhu = siZhu && (siZhu.year || siZhu.month || siZhu.day || siZhu.hour);
    if (hasSiZhu) {
      meta.appendChild(renderSiZhuSpans(siZhu));
    } else if (pan.meta.hourLabel) {
      meta.appendChild(document.createTextNode(pan.meta.hourLabel));

  function lunarMonthGanZhi(lunar) {
    if (!lunar) return '';
    if (typeof lunar.getMonthInGanZhiExact === 'function') {
      return lunar.getMonthInGanZhiExact() || '';
    }
    if (typeof lunar.getMonthInGanZhi === 'function') {
      return lunar.getMonthInGanZhi() || '';
    }
    return '';
  }

  // 夜子時與四柱只在這裡。時鐘（已換算經度）或卦例紀錄都走 readTime。
  // 23 點：時辰仍用當下鐘點（子時），日柱、農曆、旬空用次日。
  function settleClock(clock) {
    const hour = clock.getHours();
    const effectiveDate = hour === 23
      ? new Date(clock.getTime() + 3600000)
      : new Date(clock.getTime());
    const dayGZ = getDayGanZhi(effectiveDate);
    const hourGZ = getHourGanZhi(dayGZ.ganIdx, hour);
    const lunar = Lunar.fromDate(effectiveDate);
    const year = lunar.getYearInGanZhiByLiChun() || '';
    const month = lunarMonthGanZhi(lunar);
    const day = dayGZ.gan + dayGZ.zhi;
    return {
      effectiveDate,
      hour,
      dayGZ,
      hourGZ,
      xunKong: getXunKong(dayGZ),
      lunar,
      yearGanZhi: year,
      lunarMonthNum: Math.abs(lunar.getMonth()),
      lunarDayNum: lunar.getDay(),
      shiChen: getShiChen(hour),
      siZhu: {
        year,
        month,
        day,
        hour: hourGZ.label || (hourGZ.gan + hourGZ.zhi)
      }
    };
  }

  function readTime(input) {
    if (input && input.record) {
      const rec = input.record;
      const ymd = parseCaseYMD(rec.date);
      const hm = parseCaseHourMinute((rec.trueSolarTime || rec.time) || '');
      const dunLabel = rec.dunLabel || '';
      if (!ymd) return { xunKong: [], hourGZ: null, siZhu: null, dunLabel };
      const hour = hm ? hm.hour : 12;
      const minute = hm ? hm.minute : 0;
      const settled = settleClock(new Date(ymd.y, ymd.mo - 1, ymd.d, hour, minute, 0));
      return {
        xunKong: settled.xunKong,
        hourGZ: hm ? settled.hourGZ : null,
        siZhu: hm ? settled.siZhu : null,
        dunLabel
      };
    }

    const stdTime = new Date(input.y, input.mo - 1, input.d, input.hh, input.mm, 0);
    const tst = calcTrueSolarTime(stdTime, input.lon);
    const settled = settleClock(tst.time);
    const shiChenNum = getShiChenNum(settled.shiChen);
    const yearZhi = settled.yearGanZhi.charAt(1);
    const yearZhiNum = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 }[yearZhi];
    const sum = yearZhiNum + settled.lunarMonthNum + settled.lunarDayNum + shiChenNum;
    let remainder = sum % 9;
    if (remainder === 0) remainder = 9;
    const dunType = getDunType(tst.time);
    const dunLabel = (dunType === 'yang' ? '陽遁' : '陰遁') + remainder + '局';
    return {
      tst,
      trueSolarLabel: String(tst.time.getHours()).padStart(2, '0') + ':' + String(tst.time.getMinutes()).padStart(2, '0'),
      correctionMin: tst.correctionMin,
      yearGanZhi: settled.yearGanZhi,
      lunarMonthNum: settled.lunarMonthNum,
      lunarDayNum: settled.lunarDayNum,
      shiChen: settled.shiChen,
      dunLabel,
      hourGZ: settled.hourGZ,
      siZhu: settled.siZhu,
      xunKong: settled.xunKong
    };
  }

  const QIMEN_MODAL_TAP_MS = 550;

  function registerQimenModalTap(cell) {
    if (!cell) return;
    if (qimenModalTapState.el !== cell) {
      qimenModalTapState.el = cell;
      qimenModalTapState.count = 1;
    } else {
      qimenModalTapState.count += 1;
    }
    if (qimenModalTapState.timer) clearTimeout(qimenModalTapState.timer);
    if (qimenModalTapState.count >= 3) {
      qimenModalTapState.el = null;
      qimenModalTapState.count = 0;
      qimenModalTapState.timer = null;
      openQimenModal(cell);
      return;
    }
    qimenModalTapState.timer = setTimeout(() => {
      qimenModalTapState.el = null;
      qimenModalTapState.count = 0;
      qimenModalTapState.timer = null;
    }, QIMEN_MODAL_TAP_MS);

  function linesToTrigramNum(lines) {
    for (let i = 1; i <= 8; i++) {
      const t = TRIGRAMS[i].lines;
      if (t[0] === lines[0] && t[1] === lines[1] && t[2] === lines[2]) return i;
    }
    return 1;
  }

  function getHexNameFromSixLines(sixLines) {
    const lower = [sixLines[0], sixLines[1], sixLines[2]];
    const upper = [sixLines[3], sixLines[4], sixLines[5]];
    const upperNum = linesToTrigramNum(upper);
    const lowerNum = linesToTrigramNum(lower);
    return HEXAGRAM_NAMES[`${upperNum}_${lowerNum}`] || '—';
  }

  function formatPoem(poem) {
    if (!poem || !poem.trim()) return '';
    const lines = poem.split('\n').filter(l => l.trim());
    const merged = [];
    for (let i = 0; i < lines.length; i += 2) {
      if (i + 1 < lines.length) {
        merged.push(lines[i].trim() + '　' + lines[i+1].trim());
      } else {
        merged.push(lines[i].trim());
      }
    }
    return merged.join('\n');
  }

  function getDayGanZhi(date) {
    const base = new Date(Date.UTC(1900, 0, 1));
    const target = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const diffDays = Math.round((target - base) / 86400000);
    const ganIdx = ((0 + diffDays) % 10 + 10) % 10;
    const zhiIdx = ((10 + diffDays) % 12 + 12) % 12;
    return { gan: TIAN_GAN[ganIdx], zhi: DI_ZHI[zhiIdx], ganIdx, zhiIdx };
  }

  function getXunKong(dayGanZhi) {
    const ganIdx = dayGanZhi.ganIdx;
    const zhiIdx = dayGanZhi.zhiIdx;
    const xunShouZhi = ((zhiIdx - ganIdx) % 12 + 12) % 12;
    const xunKongMap = {
      0: ['戌','亥'], 10: ['申','酉'], 8: ['午','未'],
      6: ['辰','巳'], 4: ['寅','卯'], 2: ['子','丑']
    };
    return xunKongMap[xunShouZhi] || [];
  }

  function equationOfTime(date) {
    const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    const B = (360 / 365) * (dayOfYear - 81) * Math.PI / 180;
    return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  }

  function calcTrueSolarTime(date, lon) {
    const lonCorrection = (lon - 120) * 4;
    const eot = equationOfTime(date);
    const totalCorrectionMin = lonCorrection + eot;
    const result = new Date(date.getTime() + totalCorrectionMin * 60000);
    return { time: result, correctionMin: totalCorrectionMin, lonCorrection, eot };
  }

  async function queryCityLon(cityName) {
    const cache = loadGeoCache();
    const key = cityName.trim().toLowerCase();
    if (cache[key]) return cache[key];
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(cityName);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('地理查詢失敗');
    const data = await res.json();
    if (!data || data.length === 0) throw new Error('找不到該城市');
    const result = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), displayName: data[0].display_name };
    cache[key] = result;
    saveGeoCache(cache);
    return result;
  }

  function jieQiJD(year, type) {
    const Y = (year - 2000) / 1000;
    const terms = {
      summer: [
        2451716.56767, 365241.62603, 0.00325, 0.00888, -0.00030,
        -0.00030, 0.00007, -0.00002, -0.00002, 0.00001
      ],
      winter: [
        2451900.05952, 365242.74049, -0.06223, -0.00823, 0.00032,
        0.00025, -0.00007, 0.00003, 0.00001, -0.00001
      ]
    };
    const t = type === 1 ? terms.summer : terms.winter;
    const JDE0 = t[0] + t[1] * Y + (t[2] + t[3] * Y) * Y * Y
      + (t[4] + t[5] * Y) * Y * Y * Y
      + (t[6] + t[7] * Y) * Y * Y * Y * Y
      + (t[8] + t[9] * Y) * Y * Y * Y * Y * Y;
    const deltaT = 69;
    return JDE0 - deltaT / 86400;
  }

  function jdToDate(jd) {
    const unixMs = (jd - 2440587.5) * 86400000;
    return new Date(unixMs);
  }

  function getSummerSolstice(year) { return jdToDate(jieQiJD(year, 1)); }
  function getWinterSolstice(year) { return jdToDate(jieQiJD(year, 3)); }

  function getDunType(date) {
    const year = date.getFullYear();
    const events = [];
    for (const y of [year - 1, year, year + 1]) {
      events.push({ name: '夏至', time: getSummerSolstice(y) });
      events.push({ name: '冬至', time: getWinterSolstice(y) });
    }
    events.sort((a, b) => a.time - b.time);
    const t = date.getTime();
    let lastEvent = null;
    for (const ev of events) {
      if (ev.time.getTime() <= t) lastEvent = ev;
      else break;
    }
    if (!lastEvent) return 'yang';
    return lastEvent.name === '冬至' ? 'yang' : 'yin';
  }

    infoPanel.classList.toggle('expanded');
  });

  function initDateTime() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    dateInput.value = `${y}-${m}-${d}`;
    timeInput.value = `${hh}:${mm}`;
    syncDateTimeDisplays();
  }
  initDateTime();

  function getShiChen(hour) {
    const zhiNames = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const idx = Math.floor(((hour + 1) % 24) / 2);
    return zhiNames[idx];
  }

  function getShiChenNum(zhi) {
    const map = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 };
    return map[zhi] || 1;
  }

  async function updateInfo() {
    try {
      const cityName = cityInput.value.trim() || '香港';
      let geo;
      if (cityName === '香港' || cityName === 'Hong Kong') {
        geo = { lat: 22.32, lon: 114.17, displayName: '香港' };
      } else {
        geo = await queryCityLon(cityName);
      }
      currentLon = geo.lon;
      currentLat = geo.lat;

      const [y, mo, d] = dateInput.value.split('-').map(Number);
      const [hh, mm] = timeInput.value.split(':').map(Number);
      const clock = readTime({ y, mo, d, hh, mm, lon: currentLon });
      currentXunKong = clock.xunKong;
      lastTrueSolarTime = clock.trueSolarLabel;
      lastDun = clock.dunLabel;
      lastHourGZ = clock.hourGZ;
      lastSiZhu = clock.siZhu;

      const corrStr = (clock.correctionMin >= 0 ? '+' : '') + clock.correctionMin.toFixed(1) + '分';
      infoReadout.innerHTML =
        `${clock.yearGanZhi}年${clock.lunarMonthNum}月${clock.lunarDayNum}日${clock.shiChen}時<br>` +
        `真太陽時：<span class="highlight">${clock.trueSolarLabel}</span>　校正：${corrStr}`;
      infoDun.textContent = clock.dunLabel;

      syncDateTimeDisplays();
      infoSummaryText.textContent = `${formatDateDisplay(y, mo, d)} · ${formatTimeDisplay(hh, mm)} · ${cityName} · ${clock.dunLabel}`;

      updateXunKongDisplay();
      const liveRoot = document.getElementById('viewCast');
      const liveQimen = liveRoot && liveRoot.querySelector('[data-chart="qimen"]');
      if (liveQimen && liveQimen.style.display !== 'none') {
        await showChart(liveRoot, 'live', { refreshQimen: true });
      }
    } catch (e) {
      infoReadout.textContent = '（' + e.message + '）';
    }
  }

  dateInput.addEventListener('change', updateInfo);
  timeInput.addEventListener('change', updateInfo);
  dateInput.addEventListener('input', syncDateTimeDisplays);
  timeInput.addEventListener('input', syncDateTimeDisplays);
  cityInput.addEventListener('change', updateInfo);

  const inputArea = document.getElementById('inputArea');
  for (let i = 5; i >= 0; i--) {
    const row = document.createElement('div');
    row.className = 'input-row';
    const label = document.createElement('label');
    label.textContent = LINE_NAMES[i];
    const select = document.createElement('select');
    select.dataset.index = i;
    OPTIONS.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
    select.value = '7';
    row.appendChild(label);
    row.appendChild(select);
    inputArea.appendChild(row);
  }

  function getLineValue(val) {
    return (val === '7' || val === '9') ? 1 : 0;
  }
  function isMoving(val) {
    return val === '6' || val === '9';
  }

  function getSixLinesInput() {
    const selects = document.querySelectorAll('#inputArea select');
    const sixLines = [];
    const movingLineIndexes = [];
    selects.forEach(sel => {
      const i = parseInt(sel.dataset.index);
      const val = sel.value;
      sixLines[i] = getLineValue(val);
      if (isMoving(val)) movingLineIndexes.push(i);
    });
    return { sixLines, movingLineIndexes };
  }

  function getRawSixLines() {
    const raw = [];
    document.querySelectorAll('#inputArea select').forEach(sel => {
      raw[parseInt(sel.dataset.index)] = sel.value;
    });
    return raw;
  }

  function renderSixLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 5; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function renderTrigramLines(lines, container) {
    container.innerHTML = '';
    for (let i = 0; i <= 2; i++) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        lineDiv.innerHTML = '<div class="bar-yang"></div>';
      } else {
        lineDiv.innerHTML = '<div class="yin-pair"><div class="half-bar"></div><div class="half-bar"></div></div>';
      }
      container.appendChild(lineDiv);
    }
  }

  function updateLive() {
    const { sixLines, movingLineIndexes } = getSixLinesInput();
    const chgLines = sixLines.slice();
    movingLineIndexes.forEach(i => { chgLines[i] = chgLines[i] === 1 ? 0 : 1; });
    showChart(document.getElementById('viewCast'), 'live', {
      benLines: sixLines,
      chgLines,
      clearBoard: true
    });
  }

  document.querySelectorAll('#inputArea select').forEach(sel => {
    sel.addEventListener('change', updateLive);
  });

  updateLive();

  const castBtn = document.getElementById('castBtn');
  const errorMsg = document.getElementById('errorMsg');

  castBtn.addEventListener('click', async () => {
    errorMsg.textContent = '';
    const { sixLines, movingLineIndexes } = getSixLinesInput();

    castBtn.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'cast',
          sixLines: sixLines,
          movingLineIndexes: movingLineIndexes
        })
      });
      const data = await res.json();
      if (data.error) {
        errorMsg.textContent = data.error;
        castBtn.disabled = false;
        return;
      }

      await showChart(document.getElementById('viewCast'), 'live', {
        sixiang: data.sixiang || null,
        palaces: data.palaces
      });
    } catch (e) {
      errorMsg.textContent = '連線失敗：' + e.message;
    }
    castBtn.disabled = false;
  });

  function renderBagua(palaces, options) {
    const wrap = options && options.wrap;
    if (!wrap) return;
    const interactive = !!(options && options.interactive);
    const xunKong = options && options.xunKong !== undefined ? options.xunKong : currentXunKong;
    const onSelect = options && options.onSelect;
    const selected = (options && options.selected) || '';

    wrap.innerHTML = '';

    ZHI_LAYOUT.forEach(item => {
      const div = document.createElement('div');
      div.className = 'zhi';
      div.dataset.zhi = item.zhi;
      div.textContent = item.zhi;
      div.style.gridRow = item.row;
      div.style.gridColumn = item.col;
      wrap.appendChild(div);
    });

    PALACE_LAYOUT.forEach(item => {
      const div = document.createElement('div');
      div.className = 'palace';
      div.dataset.palace = item.name;
      div.style.gridRow = item.row;
      div.style.gridColumn = item.col;

      if (item.name === '中') {
        div.classList.add('empty');
        wrap.appendChild(div);
        return;
      }

      const p = palaces[item.name];
      if (!p) {
        div.classList.add('empty');
        wrap.appendChild(div);
        return;
      }

      const linesDiv = document.createElement('div');
      linesDiv.className = 'palace-lines';
      renderTrigramLines(p.lines, linesDiv);
      div.appendChild(linesDiv);

      if (selected && item.name === selected) {
        div.classList.add('selected', 'yongshen');
      }

      if (interactive && onSelect) {
        div.addEventListener('click', () => {
          wrap.querySelectorAll('.palace.selected').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          onSelect(item.name);
        });
      }

      wrap.appendChild(div);
    });

    updateXunKongDisplay(wrap, xunKong);
  }

  function updateXunKongDisplay(root, xunKongList) {
    const scope = root || document.querySelector('#viewCast [data-chart="bagua"]') || document;
    const list = xunKongList !== undefined ? xunKongList : currentXunKong;
    scope.querySelectorAll('.zhi').forEach(el => {
      el.classList.remove('xunkong');
    });
    if (!list || list.length === 0) return;
    list.forEach(zhi => {
      const el = scope.querySelector(`.zhi[data-zhi="${zhi}"]`);
      if (el) el.classList.add('xunkong');
    });
  }

  function markPalaceNumber(palaceName, number, root) {
    if (!root) return;
    const scope = root;
    const el = scope.querySelector(`.palace[data-palace="${palaceName}"]`);
    if (!el) return;
    const old = el.querySelector('.palace-number');
    if (old) old.remove();
    if (number >= 1 && number <= 8) {
      const numDiv = document.createElement('div');
      numDiv.className = 'palace-number';
      numDiv.textContent = CIRCLED_NUM[number];
      el.appendChild(numDiv);
    }
  }

  function clearPalaceNumbers(root) {
    if (!root) return;
    const scope = root;
    scope.querySelectorAll('.palace-number').forEach(el => el.remove());
  }

  function markPalaceLetter(palaceName, index, root) {
    if (!root) return;
    const scope = root;
    const el = scope.querySelector(`.palace[data-palace="${palaceName}"]`);
    if (!el) return;
    const old = el.querySelector('.palace-letter');
    if (old) old.remove();
    if (index >= 1 && index < CIRCLED_ALPHA.length) {
      const letterDiv = document.createElement('div');
      letterDiv.className = 'palace-letter';
      letterDiv.textContent = CIRCLED_ALPHA[index];
      el.appendChild(letterDiv);
    }
  }

  function clearPalaceLetters(root) {
    if (!root) return;
    const scope = root;
    scope.querySelectorAll('.palace-letter').forEach(el => el.remove());
  }

  function markPalaceAsterisk(palaceName, root) {
    if (!root) return;
    const scope = root;
    const el = scope.querySelector(`.palace[data-palace="${palaceName}"]`);
    if (!el) return;
    const old = el.querySelector('.palace-asterisk');
    if (old) old.remove();
    const astDiv = document.createElement('div');
    astDiv.className = 'palace-asterisk';
    astDiv.textContent = '*';
    el.appendChild(astDiv);
  }

  function clearPalaceAsterisks(root) {
    if (!root) return;
    const scope = root;
    scope.querySelectorAll('.palace-asterisk').forEach(el => el.remove());
  }

  async function runChain(startPalace, mode, palaces) {
    const source = palaces;
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'fly',
        palaces: source,
        startPalace: startPalace,
        mode: mode
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  function makeChainItemHTML(item) {
    const formattedPoem = item.poem && item.poem.trim() ? formatPoem(item.poem) : '（卦詩待補）';
    const poemClass = item.poem && item.poem.trim() ? '' : 'empty';
    const fanyinMark = item.fanyin ? ' 【反吟】' : '';
    return `
      <div class="chain-item-name">${item.name}${fanyinMark}</div>
      <div class="chain-item-poem ${poemClass}">${formattedPoem}</div>
    `;
  }

  function chartSlots(root) {
    const q = (name) => root.querySelector('[data-chart="' + name + '"]');
    return {
      benLines: q('ben-lines'),
      benName: q('ben-name'),
      chgLines: q('chg-lines'),
      chgName: q('chg-name'),
      sixiang: q('sixiang'),
      sixiangText: q('sixiang-text'),
      baguaSection: q('bagua-section'),
      bagua: q('bagua'),
      zhengtui: q('zhengtui'),
      zhengtuiList: q('zhengtui-list'),
      pangtong: q('pangtong'),
      pangtongList: q('pangtong-list'),
      chulei: q('chulei'),
      chuleiList: q('chulei-list'),
      qimen: q('qimen'),
      qimenTitle: q('qimen-title'),
      qimenWrap: q('qimen-wrap')
    };
  }

  function chartState(root) {
    if (!root) return null;
    return chartStore.get(root) || null;
  }

  function ensureChartState(root) {
    let state = chartStore.get(root);
    if (!state) {
      state = { palaces: null, yongshen: '', zhengtui: null, pangtong: null, chulei: null };
      chartStore.set(root, state);
    }
    return state;
  }

  function resetFlyMemory(state) {
    state.yongshen = '';
    state.zhengtui = null;
    state.pangtong = null;
    state.chulei = null;
  }

  function hideChartPieces(slots, which) {
    const hide = (el) => { if (el) el.style.display = 'none'; };
    if (which.sixiang) hide(slots.sixiang);
    if (which.bagua) hide(slots.baguaSection);
    if (which.chains) {
      hide(slots.zhengtui);
      hide(slots.pangtong);
      hide(slots.chulei);
      if (slots.zhengtuiList) slots.zhengtuiList.innerHTML = '';
      if (slots.pangtongList) slots.pangtongList.innerHTML = '';
      if (slots.chuleiList) slots.chuleiList.innerHTML = '';
      if (slots.bagua) {
        clearPalaceNumbers(slots.bagua);
        clearPalaceLetters(slots.bagua);
        clearPalaceAsterisks(slots.bagua);
      }
    }
    if (which.qimen) hideQimenBoard(slots.qimen, slots.qimenWrap, slots.qimenTitle);
  }

  function fillChainList(listEl, chain, mark) {
    if (!listEl) return;
    listEl.innerHTML = '';
    (chain || []).forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'chain-item';
      div.innerHTML = makeChainItemHTML(item);
      listEl.appendChild(div);
      if (mark) mark(item, idx);
    });
  }

  function fillChuleiList(slots, chulei) {
    const listEl = slots.chuleiList;
    if (!listEl) return;
    listEl.innerHTML = '';
    if (chulei && chulei.found && chulei.items && chulei.items.length > 0) {
      chulei.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'chain-item';
        div.innerHTML = makeChainItemHTML(item);
        listEl.appendChild(div);
        markPalaceAsterisk(item.palace, slots.bagua);
      });
      return;
    }
    const div = document.createElement('div');
    div.className = 'chain-item';
    div.innerHTML = '<div class="chain-item-name" style="color:#8a8578;">無處觸類</div>';
    listEl.appendChild(div);
  }

  async function paintChartQimen(slots, ctx) {
    await showQimenBoard(
      ctx.dunLabel,
      ctx.hourGZ,
      slots.qimen,
      slots.qimenWrap,
      slots.qimenTitle,
      ctx.xunKong,
      { zuofang: ctx.zuofang || '', xiangfang: ctx.xiangfang || '' },
      ctx.siZhu
    );
  }

  async function flyOnChart(root, startPalace, timeOverride) {
    const slots = chartSlots(root);
    const state = ensureChartState(root);
    if (!state.palaces || !startPalace) return;
    resetFlyMemory(state);
    clearPalaceNumbers(slots.bagua);
    clearPalaceLetters(slots.bagua);
    clearPalaceAsterisks(slots.bagua);

    const zhengtuiData = await runChain(startPalace, 'zhengtui', state.palaces);
    fillChainList(slots.zhengtuiList, zhengtuiData.chain, (item, idx) => {
      markPalaceNumber(item.palace, idx + 1, slots.bagua);
    });
    if (slots.zhengtui) slots.zhengtui.style.display = 'block';

    const pangtongData = await runChain(startPalace, 'pangtong', state.palaces);
    fillChainList(slots.pangtongList, pangtongData.chain, (item, idx) => {
      markPalaceLetter(item.palace, idx + 1, slots.bagua);
    });
    if (slots.pangtong) slots.pangtong.style.display = 'block';

    fillChuleiList(slots, pangtongData.chulei);
    if (slots.chulei) slots.chulei.style.display = 'block';

    state.yongshen = startPalace;
    state.zhengtui = zhengtuiData.chain;
    state.pangtong = pangtongData.chain;
    state.chulei = pangtongData.chulei || { found: false, items: [] };

    const time = timeOverride || {
      dunLabel: lastDun,
      hourGZ: lastHourGZ,
      xunKong: currentXunKong,
      siZhu: lastSiZhu
    };
    await paintChartQimen(slots, {
      dunLabel: time.dunLabel,
      hourGZ: time.hourGZ,
      xunKong: time.xunKong,
      siZhu: time.siZhu,
      zuofang: startPalace,
      xiangfang: chainLastPalace(zhengtuiData.chain)
    });
  }

  // 起卦（live，可點用神）與卦例（locked，只讀重播）共用這一條排盤。
  async function showChart(root, mode, spec) {
    if (!root || !spec) return;
    const slots = chartSlots(root);
    const state = ensureChartState(root);
    const locked = mode === 'locked';

    if (spec.refreshQimen) {
      await paintChartQimen(slots, {
        dunLabel: lastDun,
        hourGZ: lastHourGZ,
        xunKong: currentXunKong,
        siZhu: lastSiZhu,
        zuofang: state.yongshen || '',
        xiangfang: chainLastPalace(state.zhengtui)
      });
      return;
    }

    if (spec.benLines && slots.benLines) {
      renderSixLines(spec.benLines, slots.benLines);
      if (slots.benName) {
        slots.benName.textContent = spec.benName || getHexNameFromSixLines(spec.benLines);
      }
    }
    if (spec.chgLines && slots.chgLines) {
      renderSixLines(spec.chgLines, slots.chgLines);
      if (slots.chgName) {
        slots.chgName.textContent = spec.chgName || getHexNameFromSixLines(spec.chgLines);
      }
    }

    if (spec.clearBoard) {
      hideChartPieces(slots, { sixiang: true, bagua: true, chains: true, qimen: true });
      state.palaces = null;
      resetFlyMemory(state);
      return;
    }

    if ('sixiang' in spec && slots.sixiang) {
      if (spec.sixiang) {
        if (slots.sixiangText) slots.sixiangText.textContent = spec.sixiang.text || '';
        slots.sixiang.style.display = 'block';
      } else {
        slots.sixiang.style.display = 'none';
        if (slots.sixiangText) slots.sixiangText.textContent = '';
      }
    }

    if (spec.palaces) {
      hideChartPieces(slots, { chains: true, qimen: true });
      resetFlyMemory(state);
      state.palaces = spec.palaces;
      const xunKong = spec.time && spec.time.xunKong !== undefined
        ? spec.time.xunKong
        : currentXunKong;
      renderBagua(spec.palaces, {
        wrap: slots.bagua,
        interactive: !locked,
        xunKong,
        selected: locked ? (spec.startPalace || '') : '',
        onSelect: locked ? null : (name) => {
          flyOnChart(root, name).catch((e) => {
            if (errorMsg) errorMsg.textContent = '飛宮鏈失敗：' + e.message;
          });
        }
      });
      if (slots.bagua) {
        slots.bagua.classList.toggle('case-bagua-locked', locked);
      }
      if (slots.baguaSection) slots.baguaSection.style.display = 'block';
    }

    if (spec.startPalace) {
      await flyOnChart(root, spec.startPalace, spec.time || null);
    } else if (locked && spec.time && spec.time.dunLabel) {
      await paintChartQimen(slots, {
        dunLabel: spec.time.dunLabel,
        hourGZ: spec.time.hourGZ,
        xunKong: spec.time.xunKong,
        siZhu: spec.time.siZhu,
        zuofang: '',
        xiangfang: ''
      });
    }
  }

  updateInfo();

  function formatChainForSheet(chain) {
    if (!Array.isArray(chain) || chain.length === 0) return '';
    return chain.map(item => {
      const fanyin = item.fanyin ? '【反吟】' : '';
      return `${item.palace}・${item.name}${fanyin}`;
    }).join(' → ');
  }

  function formatChuleiForSheet(chulei) {
    if (!chulei || !chulei.found || !Array.isArray(chulei.items) || chulei.items.length === 0) {
      return '無處觸類';
    }
    return chulei.items.map(item => {
      const fanyin = item.fanyin ? '【反吟】' : '';
      return `${item.palace}・${item.name}${fanyin}`;
    }).join('、');
  }

  const saveHistoryBtn = document.getElementById('saveHistoryBtn');
  const saveHistoryMsg = document.getElementById('saveHistoryMsg');
  if (saveHistoryBtn) {
    saveHistoryBtn.addEventListener('click', async () => {
      if (saveHistoryMsg) saveHistoryMsg.textContent = '';
      const chart = chartState(document.getElementById('viewCast'));
      if (!chart || !chart.palaces) {
        if (saveHistoryMsg) saveHistoryMsg.textContent = '請先起卦';
        return;
      }
      if (!chart.yongshen || !chart.zhengtui || !chart.pangtong) {
        if (saveHistoryMsg) saveHistoryMsg.textContent = '請先點選用神宮';
        return;
      }

      saveHistoryBtn.disabled = true;
      saveHistoryBtn.textContent = '📝 儲 存 中…';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'saveHistory',
            data: {
              question: document.getElementById('questionInput').value.trim(),
              sixLines: getRawSixLines().join(''),
              benName: document.getElementById('benName').textContent,
              chgName: document.getElementById('chgName').textContent,
              startPalace: chart.yongshen,
              zhengtui: formatChainForSheet(chart.zhengtui),
              pangtong: formatChainForSheet(chart.pangtong),
              chulei: formatChuleiForSheet(chart.chulei),
              date: dateInput.value,
              time: timeInput.value,
              city: cityInput.value.trim(),
              trueSolarTime: lastTrueSolarTime,
              dunLabel: lastDun
            }
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          if (saveHistoryMsg) saveHistoryMsg.textContent = data.error || '儲存失敗';
        } else {
          if (saveHistoryMsg) saveHistoryMsg.textContent = '已存入紀錄';
        }
      } catch (e) {
        if (saveHistoryMsg) saveHistoryMsg.textContent = '連線失敗：' + e.message;
      }
      saveHistoryBtn.disabled = false;
      saveHistoryBtn.textContent = '📝 存 入 紀 錄';
    });
  }

  const screenshotBtn = document.getElementById('screenshotBtn');
  if (screenshotBtn) {
    screenshotBtn.addEventListener('click', async () => {
      const footerActions = document.getElementById('footerActions');
      if (footerActions) footerActions.style.display = 'none';
      try {
        await captureElementToPreview(document.getElementById('viewCast'), screenshotBtn);
      } catch (e) {
        alert('生成失敗：' + e.message);
      } finally {
        if (footerActions) footerActions.style.display = '';
      }
    });
  }

  function showScreenshotPreview(dataUrl) {
    const old = document.getElementById('screenshotPreview');
    if (old) old.remove();

    const overlay = document.createElement('div');
    overlay.id = 'screenshotPreview';
    overlay.className = 'screenshot-preview';

    const closeBtn = document.createElement('button');
    closeBtn.className = 'screenshot-close';
    closeBtn.textContent = '✕ 關閉';
    closeBtn.addEventListener('click', () => overlay.remove());

    const hint = document.createElement('div');
    hint.className = 'screenshot-hint';
    hint.textContent = '長按圖片 → 存儲到照片';

    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = '飛宮易卦長圖';

    overlay.appendChild(closeBtn);
    overlay.appendChild(hint);
    overlay.appendChild(img);
    document.body.appendChild(overlay);
  }

  async function captureElementToPreview(targetEl, btn) {
    if (!targetEl || typeof html2canvas !== 'function') {
      throw new Error('截圖元件未就緒');
    }
    const label = btn ? btn.textContent : '';
    if (btn) {
      btn.disabled = true;
      btn.textContent = '📷 生 成 中…';
    }
    try {
      const canvas = await html2canvas(targetEl, {
        scale: 2,
        backgroundColor: '#faf8f3',
        useCORS: true,
        logging: false
      });
      showScreenshotPreview(canvas.toDataURL('image/png'));
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = label || '📷 生 成 長 圖';
      }
    }
  }

  // ===== 卦例頁：選單切換 + 問事關鍵詞搜尋 + 完整排盤 =====
  const menuBtn = document.getElementById('menuBtn');
  const themeBtn = document.getElementById('themeBtn');
  const themeColor = document.getElementById('themeColor');

  function applyTheme(theme) {
    const dark = theme === 'dark';
    if (dark) document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
    if (themeColor) themeColor.setAttribute('content', dark ? '#1a1814' : '#faf8f3');
    if (themeBtn) {
      themeBtn.textContent = '🌗';
      themeBtn.setAttribute('aria-label', dark ? '切換淺色外觀' : '切換深色外觀');
    }
    try { localStorage.setItem('feigong-theme', dark ? 'dark' : 'light'); } catch (e) {}
  }

  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
  }
  const appTitle = document.getElementById('appTitle');
  const viewCast = document.getElementById('viewCast');
  const viewCases = document.getElementById('viewCases');
  const caseSearchInput = document.getElementById('caseSearchInput');
  const caseSuggest = document.getElementById('caseSuggest');
  const caseSearchStatus = document.getElementById('caseSearchStatus');
  const caseDetail = document.getElementById('caseDetail');
  const caseBackBtn = document.getElementById('caseBackBtn');
  const caseMeta = document.getElementById('caseMeta');

  let showingCases = false;
  let caseSearchTimer = null;
  let caseSearchSeq = 0;
  let caseItemsCache = [];
  let lastCaseQuery = '';
  let currentCaseItem = null;

  function setViewMode(cases) {
    showingCases = cases;
    viewCast.hidden = cases;
    viewCases.hidden = !cases;
    appTitle.textContent = cases ? '卦 例' : '飛宮易卦';
    menuBtn.classList.toggle('is-open', cases);
    menuBtn.setAttribute('aria-label', cases ? '返回起卦頁面' : '切換卦例頁面');
    if (cases) {
      caseSearchInput.focus();
    } else {
      resetCaseView();
    }
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatCaseDateLabel(value) {
    if (value == null || value === '') return '';
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      if (value.getFullYear() < 1905) return '';
      return formatDateDisplay(value.getFullYear(), value.getMonth() + 1, value.getDate());
    }
    const s = String(value).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
      const [y, mo, d] = s.slice(0, 10).split('-').map(Number);
      if (![y, mo, d].some(n => Number.isNaN(n))) return formatDateDisplay(y, mo, d);
    }
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime()) && parsed.getFullYear() >= 1905) {
      return formatDateDisplay(parsed.getFullYear(), parsed.getMonth() + 1, parsed.getDate());
    }
    return '';
  }

  function formatCaseTimeLabel(value) {
    if (value == null || value === '') return '';
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      return formatTimeDisplay(value.getHours(), value.getMinutes());
    }
    const s = String(value).trim();
    const m = s.match(/(\d{1,2}):(\d{2})/);
    if (m) return formatTimeDisplay(Number(m[1]), Number(m[2]));
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime())) {
      return formatTimeDisplay(parsed.getHours(), parsed.getMinutes());
    }
    return s;
  }

  function parseRawSixLines(raw) {
    const text = String(raw == null ? '' : raw).trim();
    const chars = text.length === 6 ? text.split('') : text.split(/[,\s]+/).filter(Boolean);
    if (chars.length !== 6 || chars.some(c => !['6', '7', '8', '9'].includes(c))) {
      throw new Error('六爻資料不完整');
    }
    const sixLines = chars.map(getLineValue);
    const movingLineIndexes = [];
    chars.forEach((c, i) => { if (isMoving(c)) movingLineIndexes.push(i); });
    return { raw: chars, sixLines, movingLineIndexes };
  }

  function highlightQuestion(text, query) {
    const src = String(text == null || text === '' ? '（無問事）' : text);
    const q = String(query || '').trim();
    if (!q) return escapeHtml(src);
    const lower = src.toLowerCase();
    const qLower = q.toLowerCase();
    let out = '';
    let i = 0;
    while (i < src.length) {
      const idx = lower.indexOf(qLower, i);
      if (idx === -1) {
        out += escapeHtml(src.slice(i));
        break;
      }
      out += escapeHtml(src.slice(i, idx));
      out += '<u>' + escapeHtml(src.slice(idx, idx + q.length)) + '</u>';
      i = idx + q.length;
    }
    return out;
  }

  function hideSuggest() {
    caseSuggest.hidden = true;
    caseSuggest.innerHTML = '';
  }

  function resetCaseView() {
    caseDetail.hidden = true;
    hideSuggest();
    caseSearchStatus.textContent = '';
    caseItemsCache = [];
    lastCaseQuery = '';
    currentCaseItem = null;
    closeCaseNoteModal();
  }

  function closeCaseNoteModal() {
    const modal = document.getElementById('caseNoteModal');
    if (modal) modal.hidden = true;
    const modalMsg = document.getElementById('caseNoteModalMsg');
    if (modalMsg) modalMsg.textContent = '';
  }

  function openCaseNoteModal() {
    const modal = document.getElementById('caseNoteModal');
    const input = document.getElementById('caseNoteInput');
    const modalMsg = document.getElementById('caseNoteModalMsg');
    const footerMsg = document.getElementById('caseNoteMsg');
    if (footerMsg) footerMsg.textContent = '';
    if (modalMsg) modalMsg.textContent = '';
    if (!currentCaseItem || !currentCaseItem.sheetRow) {
      if (footerMsg) footerMsg.textContent = '無法對應 Sheet 列，請重新搜尋卦例';
      return;
    }
    if (input) input.value = currentCaseItem.note == null ? '' : String(currentCaseItem.note);
    if (modal) modal.hidden = false;
    if (input) {
      input.focus();
      const len = input.value.length;
      input.setSelectionRange(len, len);
    }
  }

  function showSuggest(items, query) {
    caseDetail.hidden = true;
    if (!items.length) {
      hideSuggest();
      return;
    }
    caseSuggest.innerHTML = items.map((item, index) =>
      `<button type="button" class="case-suggest-item" data-case-index="${index}">${highlightQuestion(item.question, query)}</button>`
    ).join('');
    caseSuggest.hidden = false;
  }

  function parseCaseYMD(value) {
    if (value == null || value === '') return null;
    if (value instanceof Date && !Number.isNaN(value.getTime()) && value.getFullYear() >= 1905) {
      return { y: value.getFullYear(), mo: value.getMonth() + 1, d: value.getDate() };
    }
    const s = String(value).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return { y: Number(m[1]), mo: Number(m[2]), d: Number(m[3]) };
    m = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    if (m) {
      const mo = MONTH_ABBR.indexOf(m[2]) + 1;
      if (mo) return { y: Number(m[3]), mo, d: Number(m[1]) };
    }
    const label = formatCaseDateLabel(value);
    m = String(label).match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    if (m) {
      const mo = MONTH_ABBR.indexOf(m[2]) + 1;
      if (mo) return { y: Number(m[3]), mo, d: Number(m[1]) };
    }
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime()) && parsed.getFullYear() >= 1905) {
      return { y: parsed.getFullYear(), mo: parsed.getMonth() + 1, d: parsed.getDate() };
    }
    return null;
  }

  function parseCaseHourMinute(value) {
    if (value == null || value === '') return null;
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
      return { hour: value.getHours(), minute: value.getMinutes() };
    }
    const s = String(value).trim();
    const m = s.match(/(\d{1,2}):(\d{2})/);
    if (m) return { hour: Number(m[1]), minute: Number(m[2]) };
    const parsed = new Date(s);
    if (!Number.isNaN(parsed.getTime())) {
      return { hour: parsed.getHours(), minute: parsed.getMinutes() };
    }
    return null;
  }

  async function openCaseDetail(item) {
    hideSuggest();
    currentCaseItem = item;
    closeCaseNoteModal();
    const noteMsg = document.getElementById('caseNoteMsg');
    if (noteMsg) noteMsg.textContent = '';
    caseDetail.hidden = false;
    caseSearchStatus.textContent = '載入排盤…';

    const question = item.question || '（無問事）';
    const clock = formatCaseTimeLabel(item.time);
    const solar = formatCaseTimeLabel(item.trueSolarTime);
    let timePart = clock;
    if (solar) {
      timePart = clock ? `${clock}（${solar}）` : `（${solar}）`;
    }
    const metaLine = [
      formatCaseDateLabel(item.date),
      timePart,
      item.city || '',
      item.dunLabel || ''
    ].filter(Boolean).join(' · ');
    caseMeta.innerHTML =
      `<div class="case-meta-question">${escapeHtml(question)}</div>` +
      (metaLine ? `<div class="case-meta-line">${escapeHtml(metaLine)}</div>` : '');

    try {
      const parsed = parseRawSixLines(item.sixLines);
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'cast',
          sixLines: parsed.sixLines,
          movingLineIndexes: parsed.movingLineIndexes
        })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || '起卦失敗');

      const benLines = data.ben ? data.ben.lines : parsed.sixLines;
      const chgLines = data.changed ? data.changed.lines : parsed.sixLines;
      await showChart(document.getElementById('caseCaptureRoot'), 'locked', {
        benLines,
        chgLines,
        benName: (data.ben && data.ben.name) || item.benName || getHexNameFromSixLines(benLines),
        chgName: (data.changed && data.changed.name) || item.chgName || getHexNameFromSixLines(chgLines),
        sixiang: data.sixiang || null,
        palaces: data.palaces,
        startPalace: item.startPalace || '',
        time: readTime({ record: item })
      });

      caseSearchStatus.textContent = '';
    } catch (e) {
      caseSearchStatus.textContent = '載入失敗：' + e.message;
    }
  }

  async function searchCases(query) {
    const seq = ++caseSearchSeq;
    lastCaseQuery = query;
    caseSearchStatus.textContent = '搜尋中…';
    caseItemsCache = [];
    hideSuggest();
    caseDetail.hidden = true;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'searchHistory', query })
      });
      const data = await res.json();
      if (seq !== caseSearchSeq) return;
      if (!res.ok || data.error) {
        caseSearchStatus.textContent = data.error || '搜尋失敗';
        return;
      }
      caseItemsCache = Array.isArray(data.items) ? data.items : [];
      if (caseItemsCache.length === 0) {
        caseSearchStatus.textContent = '沒有符合的卦例';
        return;
      }
      caseSearchStatus.textContent = '';
      showSuggest(caseItemsCache, query);
    } catch (e) {
      if (seq !== caseSearchSeq) return;
      caseSearchStatus.textContent = '連線失敗：' + e.message;
    }
  }

  if (menuBtn) {
    menuBtn.addEventListener('click', () => setViewMode(!showingCases));
  }

  if (caseBackBtn) {
    caseBackBtn.addEventListener('click', () => {
      caseDetail.hidden = true;
      currentCaseItem = null;
      closeCaseNoteModal();
      caseSearchStatus.textContent = '';
      const noteMsg = document.getElementById('caseNoteMsg');
      if (noteMsg) noteMsg.textContent = '';
      if (caseItemsCache.length && lastCaseQuery) {
        showSuggest(caseItemsCache, lastCaseQuery);
      }
      caseSearchInput.focus();
    });
  }

  const caseScreenshotBtn = document.getElementById('caseScreenshotBtn');
  if (caseScreenshotBtn) {
    caseScreenshotBtn.addEventListener('click', async () => {
      const footer = document.getElementById('caseFooterActions');
      if (footer) footer.style.display = 'none';
      try {
        await captureElementToPreview(
          document.getElementById('caseCaptureRoot'),
          caseScreenshotBtn
        );
      } catch (e) {
        alert('生成失敗：' + e.message);
      } finally {
        if (footer) footer.style.display = '';
      }
    });
  }

  const caseNoteBtn = document.getElementById('caseNoteBtn');
  if (caseNoteBtn) {
    caseNoteBtn.addEventListener('click', () => openCaseNoteModal());
  }

  const caseNoteCancelBtn = document.getElementById('caseNoteCancelBtn');
  if (caseNoteCancelBtn) {
    caseNoteCancelBtn.addEventListener('click', () => closeCaseNoteModal());
  }

  const caseNoteBackdrop = document.getElementById('caseNoteBackdrop');
  if (caseNoteBackdrop) {
    caseNoteBackdrop.addEventListener('click', () => closeCaseNoteModal());
  }

  const caseNoteSaveBtn = document.getElementById('caseNoteSaveBtn');
  if (caseNoteSaveBtn) {
    caseNoteSaveBtn.addEventListener('click', async () => {
      const input = document.getElementById('caseNoteInput');
      const modalMsg = document.getElementById('caseNoteModalMsg');
      const footerMsg = document.getElementById('caseNoteMsg');
      if (!currentCaseItem || !currentCaseItem.sheetRow) {
        if (modalMsg) modalMsg.textContent = '無法對應 Sheet 列';
        return;
      }
      const note = input ? input.value : '';
      caseNoteSaveBtn.disabled = true;
      caseNoteSaveBtn.textContent = '儲 存 中…';
      if (modalMsg) modalMsg.textContent = '';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'saveNote',
            sheetRow: currentCaseItem.sheetRow,
            note
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          if (modalMsg) modalMsg.textContent = data.error || '儲存失敗';
          return;
        }
        currentCaseItem.note = data.note == null ? note : String(data.note);
        const cached = caseItemsCache.find(
          (it) => it && it.sheetRow === currentCaseItem.sheetRow
        );
        if (cached) cached.note = currentCaseItem.note;
        closeCaseNoteModal();
        if (footerMsg) footerMsg.textContent = '筆記已儲存';
      } catch (e) {
        if (modalMsg) modalMsg.textContent = '連線失敗：' + e.message;
      } finally {
        caseNoteSaveBtn.disabled = false;
        caseNoteSaveBtn.textContent = '儲 存';
      }
    });
  }

  if (caseSuggest) {
    caseSuggest.addEventListener('click', (e) => {
      const btn = e.target.closest('.case-suggest-item');
      if (!btn) return;
      const idx = parseInt(btn.dataset.caseIndex, 10);
      const item = caseItemsCache[idx];
      if (item) openCaseDetail(item);
    });
  }

  if (caseSearchInput) {
    caseSearchInput.addEventListener('input', () => {
      const query = caseSearchInput.value.trim();
      if (caseSearchTimer) clearTimeout(caseSearchTimer);
      if (!query) {
        caseSearchSeq += 1;
        resetCaseView();
        return;
      }
      caseSearchTimer = setTimeout(() => searchCases(query), 350);
    });

    caseSearchInput.addEventListener('focus', () => {
      if (!caseDetail.hidden) return;
      if (caseItemsCache.length && lastCaseQuery && caseSearchInput.value.trim() === lastCaseQuery) {
        showSuggest(caseItemsCache, lastCaseQuery);
      }
    });
  }

  const qimenModalCloseBtn = document.getElementById('qimenModalCloseBtn');
  if (qimenModalCloseBtn) {
    qimenModalCloseBtn.addEventListener('click', () => closeQimenModal());
  }
  const qimenModalBackdrop = document.getElementById('qimenModalBackdrop');
  if (qimenModalBackdrop) {
    qimenModalBackdrop.addEventListener('click', () => closeQimenModal());
  }

  document.addEventListener('click', (e) => {
    if (!showingCases) return;
    if (e.target.closest('.case-search-wrap')) return;
    if (!caseSuggest.hidden) hideSuggest();
  });
</script>
</body>
</html>
