<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飛宮易卦 v0.1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #faf8f3;
      font-family: 'Noto Serif TC', 'Times New Roman', 'Microsoft JhengHei', serif;
      min-height: 100vh;
      padding: 1.5rem;
      color: #2a2a2a;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 0.5rem;
      text-align: center;
      color: #2a2a2a;
      padding-bottom: 0.8rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #d4cfc0;
    }

    /* 上半部：輸入 + 本卦變卦 */
    .top-section {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.5rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }

    /* 六爻輸入 */
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 32px;
    }

    .input-row label {
      width: 2.5rem;
      font-size: 0.8rem;
      color: #8a8578;
      text-align: right;
      letter-spacing: 0.05rem;
    }

    .input-row select {
      width: 4rem;
      height: 28px;
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 4px;
      padding: 0 0.4rem;
      font-size: 0.95rem;
      font-family: 'Menlo', 'Consolas', monospace;
      color: #2a2a2a;
      outline: none;
      cursor: pointer;
    }

    .input-row select:focus {
      border-color: #8a6d3b;
      box-shadow: 0 0 0 2px #8a6d3b22;
    }

    /* 即時卦圖（在輸入右側） */
    .live-lines {
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      margin-left: 0.5rem;
      align-items: center;
      justify-content: center;
    }

    .line {
      display: flex;
      gap: 5px;
      width: 80px;
      height: 10px;
    }

    .bar-yang {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .yin-pair {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .half-bar {
      flex: 1;
      background: #2a2a2a;
      border-radius: 1px;
    }

    .btn {
      background: #2a2a2a;
      border: none;
      border-radius: 4px;
      padding: 0.6rem 2rem;
      font-size: 1rem;
      color: #faf8f3;
      letter-spacing: 0.3rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      margin-top: 0.8rem;
    }

    .btn:hover {
      background: #444;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 本卦變卦 */
    .hex-result {
      display: flex;
      gap: 2rem;
      justify-content: center;
      align-items: flex-start;
    }

    .hex-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      min-width: 100px;
    }

    .hex-box-title {
      font-size: 0.8rem;
      color: #8a8578;
      letter-spacing: 0.2rem;
    }

    .hex-box-name {
      font-size: 1.3rem;
      color: #2a2a2a;
      letter-spacing: 0.1rem;
      min-height: 1.8rem;
    }

    .hex-box-lines {
      display: flex;
      flex-direction: column-reverse;
      gap: 5px;
      align-items: center;
    }

    .hex-box-lines .line {
      width: 90px;
      height: 11px;
    }

    /* 九宮格 */
    .nine-grid-section {
      margin-top: 2rem;
      display: none;
    }

    .nine-grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 6px;
      justify-content: center;
      margin: 0 auto;
    }

    .palace {
      background: #fff;
      border: 1px solid #d4cfc0;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      gap: 3px;
      padding: 4px;
    }

    .palace:hover {
      border-color: #8a6d3b;
      box-shadow: 0 0 0 2px #8a6d3b22;
    }

    .palace.selected {
      border-color: #8a6d3b;
      background: #f5efe0;
      box-shadow: 0 0 0 2px #8a6d3b44;
    }

    .palace.empty {
      cursor: default;
      opacity: 0.3;
      background: #f0ede6;
    }

    .palace-name {
      font-size: 0.75rem;
      color: #8a8578;
      letter-spacing: 0.1rem;
    }

    .palace-lines {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      align-items: center;
    }

    .palace-lines .line {
      width: 40px;
      height: 6px;
    }

    .palace-lines .yin-pair {
      gap: 4px;
    }

    /* 飛宮鏈 */
    .chain-section {
      margin-top: 2rem;
      display: none;
    }

    .chain-item {
      background: #fff;
      border: 1px solid #d4cfc0;
      border-left: 3px solid #8a6d3b;
      border-radius: 4px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
    }

    .chain-item-name {
      font-size: 1.1rem;
      color: #2a2a2a;
      letter-spacing: 0.1rem;
      margin-bottom: 0.5rem;
    }

    .chain-item-poem {
      font-size: 0.9rem;
      color: #6a6458;
      line-height: 1.7;
      white-space: pre-line;
    }

    .chain-item-poem.empty {
      color: #b0aa9c;
      font-style: italic;
    }

    .error-msg {
      color: #a04a3a;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.2rem;
    }

    /* 區塊標題 */
    .section-label {
      font-size: 0.8rem;
      color: #8a8578;
      letter-spacing: 0.2rem;
      text-align: center;
      margin-bottom: 0.8rem;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>飛宮易卦</h1>

  <div class="top-section">
    <!-- 六爻輸入 -->
    <div>
      <div class="input-area" id="inputArea"></div>
      <button class="btn" id="castBtn">起 卦</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- 即時卦圖 + 本卦變卦 -->
    <div>
      <div class="hex-result">
        <div class="hex-box">
          <div class="hex-box-title">本卦</div>
          <div class="hex-box-name" id="benName">—</div>
          <div class="hex-box-lines" id="benLines"></div>
        </div>
        <div class="hex-box">
          <div class="hex-box-title">變卦</div>
          <div class="hex-box-name" id="chgName">—</div>
          <div class="hex-box-lines" id="chgLines"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 九宮格 -->
  <div class="nine-grid-section" id="nineGridSection">
    <div class="section-label">九 宮 格</div>
    <div class="nine-grid" id="nineGrid"></div>
  </div>

  <!-- 飛宮鏈 -->
  <div class="chain-section" id="chainSection">
    <div class="section-label">飛 宮 鏈</div>
    <div id="chainList"></div>
  </div>
</div>

<script>
  // ---------- 後端 API ----------
  const API_URL = 'https://feigong-yigua.davchan-clp.workers.dev';

  // ---------- 爻名稱（初爻在下、上爻在上） ----------
  const LINE_NAMES = ['初', '二', '三', '四', '五', '上'];

  // ---------- 選項：6=老陰 7=少陽 8=少陰 9=老陽 ----------
  const OPTIONS = [
    { value: '6', label: '6' },
    { value: '7', label: '7' },
    { value: '8', label: '8' },
    { value: '9', label: '9' }
  ];

  // ---------- 生成六爻輸入列（上爻在最上、初爻在最下） ----------
  const inputArea = document.getElementById('inputArea');
  // 建立六列，但 DOM 順序：先建上爻，最後建初爻（這樣視覺上上爻在上、初爻在下）
  for (let i = 5; i >= 0; i--) {
    const row = document.createElement('div');
    row.className = 'input-row';
    const label = document.createElement('label');
    label.textContent = LINE_NAMES[i];
    const select = document.createElement('select');
    select.dataset.index = i;
    OPTIONS.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt.value;
      option.textContent = opt.label;
      select.appendChild(option);
    });
    select.value = '7'; // 預設少陽
    row.appendChild(label);
    row.appendChild(select);

    // 在每一列右側加上即時爻圖
    const liveLines = document.createElement('div');
    liveLines.className = 'live-lines';
    liveLines.dataset.index = i;
    row.appendChild(liveLines);

    inputArea.appendChild(row);
  }

  // ---------- 取得單爻的陰陽值 ----------
  function getLineValue(val) {
    // 6=老陰(0) 7=少陽(1) 8=少陰(0) 9=老陽(1)
    if (val === '6' || val === '8') return 0;
    return 1;
  }

  // ---------- 取得單爻是否為動爻 ----------
  function isMoving(val) {
    // 6=老陰(動) 9=老陽(動)
    return val === '6' || val === '9';
  }

  // ---------- 取得六爻資料 ----------
  function getSixLinesInput() {
    const selects = document.querySelectorAll('#inputArea select');
    const sixLines = [];
    const movingLines = [];
    selects.forEach(sel => {
      const i = parseInt(sel.dataset.index);
      const val = sel.value;
      sixLines[i] = getLineValue(val);
      if (isMoving(val)) movingLines.push(i);
    });
    return { sixLines, movingLines };
  }

  // ---------- 繪製爻圖（給定容器和六爻資料） ----------
  function renderLines(lines, container, size) {
    container.innerHTML = '';
    // lines 是 [初,二,三,四,五,上]，要從上爻開始畫
    for (let i = 5; i >= 0; i--) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        const bar = document.createElement('div');
        bar.className = 'bar-yang';
        lineDiv.appendChild(bar);
      } else {
        const pair = document.createElement('div');
        pair.className = 'yin-pair';
        const h1 = document.createElement('div');
        h1.className = 'half-bar';
        const h2 = document.createElement('div');
        h2.className = 'half-bar';
        pair.appendChild(h1);
        pair.appendChild(h2);
        lineDiv.appendChild(pair);
      }
      container.appendChild(lineDiv);
    }
  }

  // ---------- 繪製單爻圖（給即時顯示用） ----------
  function renderSingleLine(value, container) {
    container.innerHTML = '';
    const lineDiv = document.createElement('div');
    lineDiv.className = 'line';
    if (value === 1) {
      const bar = document.createElement('div');
      bar.className = 'bar-yang';
      lineDiv.appendChild(bar);
    } else {
      const pair = document.createElement('div');
      pair.className = 'yin-pair';
      const h1 = document.createElement('div');
      h1.className = 'half-bar';
      const h2 = document.createElement('div');
      h2.className = 'half-bar';
      pair.appendChild(h1);
      pair.appendChild(h2);
      lineDiv.appendChild(pair);
    }
    container.appendChild(lineDiv);
  }

  // ---------- 繪製三爻圖 ----------
  function renderTrigramLines(lines, container) {
    container.innerHTML = '';
    for (let i = 2; i >= 0; i--) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      if (lines[i] === 1) {
        const bar = document.createElement('div');
        bar.className = 'bar-yang';
        lineDiv.appendChild(bar);
      } else {
        const pair = document.createElement('div');
        pair.className = 'yin-pair';
        const h1 = document.createElement('div');
        h1.className = 'half-bar';
        const h2 = document.createElement('div');
        h2.className = 'half-bar';
        pair.appendChild(h1);
        pair.appendChild(h2);
        lineDiv.appendChild(pair);
      }
      container.appendChild(lineDiv);
    }
  }

  // ---------- 即時更新（每選一爻，更新即時爻圖 + 本卦變卦卦圖） ----------
  function updateLive() {
    const { sixLines } = getSixLinesInput();

    // 更新每一列右側的即時爻圖
    document.querySelectorAll('.live-lines').forEach(el => {
      const i = parseInt(el.dataset.index);
      renderSingleLine(sixLines[i], el);
    });

    // 更新本卦卦圖
    const benLines = document.getElementById('benLines');
    renderLines(sixLines, benLines);

    // 更新變卦卦圖（根據動爻翻轉）
    const { movingLines } = getSixLinesInput();
    const chgLines = [...sixLines];
    movingLines.forEach(i => {
      chgLines[i] = chgLines[i] === 1 ? 0 : 1;
    });
    const chgLinesEl = document.getElementById('chgLines');
    renderLines(chgLines, chgLinesEl);

    // 卦名先清空（等按起卦才從後端拿）
    document.getElementById('benName').textContent = '—';
    document.getElementById('chgName').textContent = '—';

    // 清空九宮格和飛宮鏈（因為六爻改了）
    document.getElementById('nineGridSection').style.display = 'none';
    document.getElementById('chainSection').style.display = 'none';
  }

  // 綁定所有 select 的 change 事件
  document.querySelectorAll('#inputArea select').forEach(sel => {
    sel.addEventListener('change', updateLive);
  });

  // 初始化
  updateLive();

  // ---------- 八卦符號 ----------
  const TRIGRAM_SYMBOLS = { 1:'☰', 2:'☱', 3:'☲', 4:'☳', 5:'☴', 6:'☵', 7:'☶', 8:'☷' };

  // ---------- 起卦 ----------
  const castBtn = document.getElementById('castBtn');
  const errorMsg = document.getElementById('errorMsg');
  const nineGridSection = document.getElementById('nineGridSection');
  const nineGrid = document.getElementById('nineGrid');
  const chainSection = document.getElementById('chainSection');
  const chainList = document.getElementById('chainList');

  let currentPalaces = null;

  castBtn.addEventListener('click', async () => {
    errorMsg.textContent = '';
    const { sixLines, movingLines } = getSixLinesInput();

    if (movingLines.length === 0) {
      errorMsg.textContent = '請至少有一個動爻（6 或 9）。';
      return;
    }
    if (movingLines.length > 1) {
      errorMsg.textContent = '目前只支援一個動爻，請只選一個 6 或 9。';
      return;
    }

    const movingLineIndex = movingLines[0];
    castBtn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'cast',
          sixLines: sixLines,
          movingLineIndex: movingLineIndex
        })
      });
      const data = await res.json();
      if (data.error) {
        errorMsg.textContent = data.error;
        castBtn.disabled = false;
        return;
      }

      // 顯示本卦、變卦卦名
      document.getElementById('benName').textContent = data.ben.name;
      document.getElementById('chgName').textContent = data.changed.name;

      // 儲存八宮
      currentPalaces = data.palaces;

      // 繪製九宮格
      renderNineGrid(data.palaces);
      nineGridSection.style.display = 'block';

      // 隱藏飛宮鏈
      chainSection.style.display = 'none';
      chainList.innerHTML = '';
    } catch (e) {
      errorMsg.textContent = '連線後端失敗：' + e.message;
    }
    castBtn.disabled = false;
  });

  // ---------- 繪製九宮格 ----------
  function renderNineGrid(palaces) {
    nineGrid.innerHTML = '';
    const gridOrder = [
      '巽', '離', '坤',
      '震', '中', '兌',
      '艮', '坎', '乾'
    ];

    gridOrder.forEach(pos => {
      const div = document.createElement('div');
      div.className = 'palace';

      if (pos === '中') {
        div.classList.add('empty');
        div.innerHTML = `<div class="palace-name">中</div>`;
        nineGrid.appendChild(div);
        return;
      }

      const p = palaces[pos];
      if (!p) {
        div.classList.add('empty');
        nineGrid.appendChild(div);
        return;
      }

      div.innerHTML = `<div class="palace-name">${pos}</div>`;
      const linesDiv = document.createElement('div');
      linesDiv.className = 'palace-lines';
      renderTrigramLines(p.lines, linesDiv);
      div.appendChild(linesDiv);

      div.addEventListener('click', () => {
        document.querySelectorAll('.palace.selected').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        runFlyingChain(pos);
      });

      nineGrid.appendChild(div);
    });
  }

  // ---------- 飛宮鏈 ----------
  async function runFlyingChain(startPalace) {
    if (!currentPalaces) return;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'fly',
          palaces: currentPalaces,
          startPalace: startPalace
        })
      });
      const data = await res.json();
      if (data.error) {
        errorMsg.textContent = data.error;
        return;
      }

      chainList.innerHTML = '';
      data.chain.forEach(item => {
        const div = document.createElement('div');
        div.className = 'chain-item';
        const poem = item.poem && item.poem.trim() ? item.poem : '（卦詩待補）';
        const poemClass = item.poem && item.poem.trim() ? '' : 'empty';
        div.innerHTML = `
          <div class="chain-item-name">${item.name}</div>
          <div class="chain-item-poem ${poemClass}">${poem}</div>
        `;
        chainList.appendChild(div);
      });

      chainSection.style.display = 'block';
    } catch (e) {
      errorMsg.textContent = '飛宮鏈計算失敗：' + e.message;
    }
  }
</script>
</body>
</html>
